<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#5865f2">

    <title>資訊系談心閣｜登入</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(120, 150, 255, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(180, 100, 255, 0.22),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #101426,
                    #171c38,
                    #22264a
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            overflow-x: hidden;
        }

        /* 背景裝飾 */

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(5px);
            pointer-events: none;
            z-index: 0;
        }

        .circle-1 {
            width: 260px;
            height: 260px;
            background: rgba(88, 101, 242, 0.16);
            top: -80px;
            left: -80px;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: rgba(170, 90, 255, 0.13);
            right: -100px;
            bottom: -100px;
        }

        /* 主卡片 */

        .login-wrapper {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 430px;

            background: rgba(24, 28, 52, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 26px;

            padding: 38px 32px 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* Logo */

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 16px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;

            background:
                linear-gradient(
                    135deg,
                    #6573ff,
                    #8067e8,
                    #a45ed5
                );

            box-shadow:
                0 12px 30px rgba(88, 101, 242, 0.35);

            user-select: none;
        }

        .logo-area h1 {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-area p {
            margin-top: 8px;

            font-size: 13px;
            color: #aeb5d2;

            line-height: 1.6;
        }

        /* 表單 */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #dfe3f7;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;

            height: 52px;

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;

            background: rgba(10, 13, 28, 0.72);

            color: #ffffff;

            padding: 0 15px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .input-wrapper.password input {
            padding-right: 55px;
        }

        .input-wrapper input::placeholder {
            color: #6f7694;
        }

        .input-wrapper input:focus {
            border-color: #7180ff;

            background: rgba(12, 16, 34, 0.9);

            box-shadow:
                0 0 0 3px rgba(113, 128, 255, 0.12);
        }

        /* 顯示密碼 */

        .password-toggle {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            border: none;
            border-radius: 10px;

            background: transparent;

            color: #8d95b6;

            cursor: pointer;

            font-size: 17px;
        }

        .password-toggle:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        /* 錯誤訊息 */

        .error-message {
            display: none;

            margin: 8px 0 15px;

            padding: 11px 13px;

            border-radius: 12px;

            background: rgba(255, 76, 76, 0.10);

            border: 1px solid rgba(255, 76, 76, 0.20);

            color: #ff9b9b;

            font-size: 13px;

            line-height: 1.5;
        }

        .error-message.show {
            display: block;
        }

        /* 登入按鈕 */

        .login-button {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #6474ff,
                    #7b68e8
                );

            color: #ffffff;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(92, 105, 245, 0.25);

            transition:
                transform 0.15s,
                filter 0.15s,
                opacity 0.15s;
        }

        .login-button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            filter: none;
        }

        /* 測試帳號 */

        .demo-box {
            margin-top: 22px;

            padding: 15px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.035);

            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .demo-title {
            color: #cdd3ee;

            font-size: 12px;
            font-weight: 800;

            margin-bottom: 10px;
        }

        .demo-account {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;

            padding: 8px 0;

            font-size: 12px;

            color: #9199b8;
        }

        .demo-account + .demo-account {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .demo-account strong {
            color: #dfe3f7;
            font-weight: 700;
        }

        .demo-account span:last-child {
            color: #7f89ff;
            font-weight: 700;
        }

        /* 安全提示 */

        .security-info {
            margin-top: 18px;

            text-align: center;

            color: #747b99;

            font-size: 11px;

            line-height: 1.7;
        }

        .security-info span {
            color: #8e97ff;
        }

        /* 頁尾 */

        .footer {
            margin-top: 22px;

            text-align: center;

            font-size: 11px;

            color: #606780;
        }

        /* RWD */

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-wrapper {
                padding: 30px 22px 25px;

                border-radius: 22px;
            }

            .logo {
                width: 68px;
                height: 68px;

                font-size: 32px;

                border-radius: 20px;
            }

            .logo-area h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <main class="login-wrapper">

        <section class="logo-area">

            <div class="logo">
                💻
            </div>

            <h1>資訊系談心閣</h1>

            <p>
                資訊系學生的交流社群<br>
                課業、程式、遊戲與日常，都可以聊
            </p>

        </section>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    帳號
                </label>

                <div class="input-wrapper">

                    <input
                        id="username"
                        type="text"
                        autocomplete="username"
                        maxlength="30"
                        placeholder="請輸入帳號"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    密碼
                </label>

                <div class="input-wrapper password">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        maxlength="50"
                        placeholder="請輸入密碼"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="顯示密碼"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div
                id="errorMessage"
                class="error-message"
            ></div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                登入談心閣
            </button>

        </form>


        <section class="demo-box">

            <div class="demo-title">
                🧪 報告測試帳號
            </div>

            <div class="demo-account">
                <strong>一般使用者</strong>
                <span>student / 123456</span>
            </div>

            <div class="demo-account">
                <strong>管理員</strong>
                <span>admin / admin123</span>
            </div>

        </section>


        <div class="security-info">
            <span>🔒</span>
            登入系統具備基本的登入失敗限制與操作紀錄功能
        </div>


        <div class="footer">
            資訊系談心閣 · Cyber Community
        </div>

    </main>


<script>

    /* =====================================================
       基本設定
       ===================================================== */

    const accounts = {

        student: {
            password: "123456",
            role: "user"
        },

        admin: {
            password: "admin123",
            role: "admin"
        }

    };


    /*
     * 登入失敗 5 次後暫時鎖定
     * 這只是前端 Demo 防護
     */

    const MAX_ATTEMPTS = 5;

    const LOCK_TIME = 30 * 1000;

    const ATTEMPTS_KEY =
        "talkingHallLoginAttempts";

    const LOCK_KEY =
        "talkingHallLoginLock";

    const LOGIN_LOG_KEY =
        "talkingHallLoginLogs";


    /* =====================================================
       DOM
       ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");

    const loginButton =
        document.getElementById("loginButton");

    const errorMessage =
        document.getElementById("errorMessage");


    /* =====================================================
       顯示錯誤
       ===================================================== */

    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.classList.add("show");

    }


    function hideError() {

        errorMessage.textContent = "";

        errorMessage.classList.remove("show");

    }


    /* =====================================================
       密碼顯示 / 隱藏
       ===================================================== */

    passwordToggle.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordToggle.textContent = "🙈";

                passwordToggle.setAttribute(
                    "aria-label",
                    "隱藏密碼"
                );

            } else {

                passwordInput.type = "password";

                passwordToggle.textContent = "👁";

                passwordToggle.setAttribute(
                    "aria-label",
                    "顯示密碼"
                );

            }

        }
    );


    /* =====================================================
       取得剩餘鎖定時間
       ===================================================== */

    function getRemainingLockMs() {

        const lockUntil =
            Number(
                localStorage.getItem(LOCK_KEY)
            );

        /*
         * 沒有鎖定紀錄
         */

        if (
            !Number.isFinite(lockUntil) ||
            lockUntil <= 0
        ) {

            return 0;

        }


        const remaining =
            lockUntil - Date.now();


        /*
         * 鎖定時間已經過了
         * 自動清除舊資料
         */

        if (remaining <= 0) {

            localStorage.removeItem(LOCK_KEY);

            localStorage.removeItem(ATTEMPTS_KEY);

            return 0;

        }


        return remaining;

    }


    /* =====================================================
       更新鎖定介面
       ===================================================== */

    function updateLockUI() {

        const remaining =
            getRemainingLockMs();


        /*
         * 沒有鎖定
         */

        if (remaining <= 0) {

            loginButton.disabled = false;

            /*
             * 如果原本顯示的是鎖定訊息
             * 就清除
             */

            if (
                errorMessage.textContent.includes(
                    "登入嘗試過於頻繁"
                )
            ) {

                hideError();

            }

            return false;

        }


        /*
         * 目前仍在鎖定
         */

        loginButton.disabled = true;


        const seconds =
            Math.ceil(
                remaining / 1000
            );


        showError(
            `登入嘗試過於頻繁，請 ${seconds} 秒後再試。`
        );


        return true;

    }


    /* =====================================================
       啟動鎖定倒數
       ===================================================== */

    let lockTimer = null;


    function startLockTimer() {

        if (lockTimer) {

            clearInterval(lockTimer);

        }


        updateLockUI();


        lockTimer =
            setInterval(
                function () {

                    const locked =
                        updateLockUI();


                    /*
                     * 鎖定結束
                     */

                    if (!locked) {

                        clearInterval(lockTimer);

                        lockTimer = null;

                    }

                },
                500
            );

    }


    /* =====================================================
       儲存登入紀錄
       ===================================================== */

    function saveLoginLog(
        username,
        success,
        role = "unknown"
    ) {

        let logs = [];

        try {

            const saved =
                localStorage.getItem(
                    LOGIN_LOG_KEY
                );

            logs =
                saved
                    ? JSON.parse(saved)
                    : [];

            if (!Array.isArray(logs)) {

                logs = [];

            }

        } catch (error) {

            logs = [];

        }


        logs.unshift({

            id:
                Date.now().toString(),

            username:
                username || "未輸入",

            success:
                success,

            role:
                role,

            time:
                new Date().toISOString()

        });


        /*
         * 只保留最近 100 筆
         */

        logs =
            logs.slice(0, 100);


        localStorage.setItem(
            LOGIN_LOG_KEY,
            JSON.stringify(logs)
        );

    }


    /* =====================================================
       登入
       ===================================================== */

    function login() {

        /*
         * 先檢查是否鎖定
         */

        if (updateLockUI()) {

            return;

        }


        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        /*
         * 基本驗證
         */

        if (!username) {

            showError("請輸入帳號。");

            usernameInput.focus();

            return;

        }


        if (!password) {

            showError("請輸入密碼。");

            passwordInput.focus();

            return;

        }


        /*
         * 取得失敗次數
         */

        let attempts =
            Number(
                localStorage.getItem(
                    ATTEMPTS_KEY
                )
            );


        if (
            !Number.isFinite(attempts) ||
            attempts < 0
        ) {

            attempts = 0;

        }


        /*
         * 查詢帳號
         */

        const account =
            accounts[username];


        /*
         * 帳號不存在或密碼錯誤
         */

        if (
            !account ||
            account.password !== password
        ) {

            attempts++;

            localStorage.setItem(
                ATTEMPTS_KEY,
                String(attempts)
            );


            saveLoginLog(
                username,
                false
            );


            /*
             * 達到最大失敗次數
             */

            if (attempts >= MAX_ATTEMPTS) {

                const lockUntil =
                    Date.now() + LOCK_TIME;


                localStorage.setItem(
                    LOCK_KEY,
                    String(lockUntil)
                );


                /*
                 * 這裡立即更新 UI
                 */

                startLockTimer();


                return;

            }


            const remainingAttempts =
                MAX_ATTEMPTS - attempts;


            showError(
                `帳號或密碼錯誤，還可以嘗試 ${remainingAttempts} 次。`
            );


            passwordInput.value = "";

            passwordInput.focus();

            return;

        }


        /* =================================================
           登入成功
           ================================================= */

        /*
         * 清除失敗紀錄
         */

        localStorage.removeItem(
            ATTEMPTS_KEY
        );

        localStorage.removeItem(
            LOCK_KEY
        );


        /*
         * 儲存登入狀態
         */

        sessionStorage.setItem(
            "loginUser",
            username
        );

        sessionStorage.setItem(
            "userRole",
            account.role
        );


        /*
         * 為了讓使用者直接雙擊 HTML 開啟時
         * 其他頁面也能讀取，暫時同步存一份。
         *
         * 注意：
         * 這是 Demo 用法，不是真正安全的登入系統。
         */

        localStorage.setItem(
            "loginUser",
            username
        );

        localStorage.setItem(
            "userRole",
            account.role
        );


        saveLoginLog(
            username,
            true,
            account.role
        );


        /*
         * 暫時禁止按鈕避免重複提交
         */

        loginButton.disabled = true;

        loginButton.textContent =
            "登入成功，正在進入…";


        /*
         * 根據角色進入不同頁面
         */

        setTimeout(
            function () {

                if (
                    account.role === "admin"
                ) {

                    window.location.href =
                        "pages/admin.html";

                } else {

                    window.location.href =
                        "pages/home.html";

                }

            },
            300
        );

    }


    /* =====================================================
       表單提交
       ===================================================== */

    loginForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            login();

        }
    );


    /* =====================================================
       輸入時清除普通錯誤
       ===================================================== */

    usernameInput.addEventListener(
        "input",
        function () {

            /*
             * 鎖定訊息不要被清掉
             */

            if (
                !errorMessage.textContent.includes(
                    "登入嘗試過於頻繁"
                )
            ) {

                hideError();

            }

        }
    );


    passwordInput.addEventListener(
        "input",
        function () {

            if (
                !errorMessage.textContent.includes(
                    "登入嘗試過於頻繁"
                )
            ) {

                hideError();

            }

        }
    );


    /* =====================================================
       頁面載入時檢查登入鎖定
       ===================================================== */

    updateLockUI();


    /*
     * 如果目前真的正在鎖定
     * 啟動倒數
     */

    if (
        getRemainingLockMs() > 0
    ) {

        startLockTimer();

    }


</script>

</body>
</html>

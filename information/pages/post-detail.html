<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#5865f2">

    <title>文章內容｜資訊系談心閣</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(95, 110, 255, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(160, 90, 255, 0.12),
                    transparent 35%
                ),
                #101426;

            color: #f4f6ff;

            padding-bottom: 50px;
        }


        /* ================================
           導覽列
           ================================ */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 50;

            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: rgba(16, 20, 38, 0.88);

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            cursor: pointer;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #6675ff,
                    #8667e8
                );

            font-size: 19px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
        }

        .back-button {
            border: none;

            padding: 10px 15px;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.06);

            color: #dce1f7;

            cursor: pointer;

            transition: 0.2s;
        }

        .back-button:hover {
            background:
                rgba(255,255,255,0.11);
        }


        /* ================================
           主容器
           ================================ */

        .container {
            width: min(920px, 92%);

            margin: 30px auto;
        }


        /* ================================
           文章
           ================================ */

        .article-card {
            background:
                rgba(25, 30, 55, 0.88);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 20px 55px rgba(0,0,0,0.25);
        }

        .category {
            display: inline-flex;

            padding: 6px 11px;

            border-radius: 9px;

            background:
                rgba(105,120,255,0.13);

            color: #aab3ff;

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 15px;
        }

        .article-title {
            font-size: clamp(24px, 5vw, 34px);

            line-height: 1.35;

            color: #ffffff;

            word-break: break-word;
        }

        .article-meta {
            margin-top: 15px;

            display: flex;
            align-items: center;
            gap: 12px;

            color: #8e96b4;

            font-size: 13px;

            flex-wrap: wrap;
        }

        .author {
            color: #b9c0dc;

            font-weight: 700;
        }

        .article-content {
            margin-top: 30px;

            color: #d9def0;

            font-size: 16px;

            line-height: 2;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }


        /* ================================
           操作區
           ================================ */

        .article-actions {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 30px;

            padding-top: 20px;

            border-top:
                1px solid rgba(255,255,255,0.07);
        }

        .action-button {
            border: none;

            padding: 11px 16px;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.06);

            color: #dce1f5;

            cursor: pointer;

            transition: 0.2s;

            font-size: 13px;
        }

        .action-button:hover {
            background:
                rgba(255,255,255,0.11);
        }

        .like-button.liked {
            background:
                rgba(255,80,130,0.14);

            color: #ff8eae;
        }

        .report-button {
            margin-left: auto;

            color: #ff9c9c;
        }


        /* ================================
           留言區
           ================================ */

        .comments-section {
            margin-top: 25px;

            background:
                rgba(25,30,55,0.88);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 22px;

            padding: 25px;
        }

        .section-title {
            font-size: 18px;

            font-weight: 800;

            margin-bottom: 18px;
        }

        .comment-form {
            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }

        .comment-input {
            flex: 1;

            min-width: 0;

            resize: vertical;

            min-height: 48px;

            max-height: 180px;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 13px;

            background:
                rgba(10,14,30,0.75);

            color: #ffffff;

            padding: 13px 14px;

            outline: none;

            font-family: inherit;

            line-height: 1.5;
        }

        .comment-input:focus {
            border-color: #7381ff;

            box-shadow:
                0 0 0 3px rgba(115,129,255,0.10);
        }

        .comment-input::placeholder {
            color: #69718e;
        }

        .comment-submit {
            align-self: flex-end;

            height: 48px;

            border: none;

            border-radius: 13px;

            padding: 0 18px;

            background:
                linear-gradient(
                    135deg,
                    #6675ff,
                    #8069e8
                );

            color: #ffffff;

            font-weight: 800;

            cursor: pointer;
        }

        .comment-list {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }

        .comment {
            padding: 15px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.05);
        }

        .comment-header {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 8px;

            font-size: 12px;
        }

        .comment-author {
            color: #aeb7ff;

            font-weight: 800;
        }

        .comment-time {
            color: #6e7692;
        }

        .comment-content {
            color: #d5daeb;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;
        }

        .empty-comment {
            text-align: center;

            color: #727a97;

            padding: 25px;
        }


        /* ================================
           錯誤 / 找不到
           ================================ */

        .not-found {
            text-align: center;

            padding: 70px 20px;

            background:
                rgba(25,30,55,0.88);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 22px;
        }

        .not-found-icon {
            font-size: 48px;

            margin-bottom: 15px;
        }

        .not-found h2 {
            margin-bottom: 10px;
        }

        .not-found p {
            color: #858da9;

            margin-bottom: 22px;
        }


        /* ================================
           Modal
           ================================ */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,0.65);

            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(460px, 100%);

            background:
                #1c213b;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 20px;

            font-weight: 800;

            margin-bottom: 18px;
        }

        .report-option {
            display: flex;
            align-items: center;

            gap: 10px;

            padding: 11px 0;

            color: #dce1f3;

            cursor: pointer;
        }

        .report-option input {
            accent-color: #6877ff;
        }

        .report-detail {
            width: 100%;

            min-height: 100px;

            resize: vertical;

            margin-top: 10px;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 12px;

            background:
                #111528;

            color: #ffffff;

            padding: 12px;

            outline: none;

            font-family: inherit;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 18px;
        }

        .modal-button {
            border: none;

            padding: 11px 17px;

            border-radius: 11px;

            cursor: pointer;

            font-weight: 700;
        }

        .cancel-button {
            background:
                rgba(255,255,255,0.07);

            color: #cbd1e5;
        }

        .submit-report {
            background:
                #e75f74;

            color: #ffffff;
        }


        /* ================================
           Toast
           ================================ */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 25px;

            transform:
                translate(-50%, 20px);

            opacity: 0;

            pointer-events: none;

            z-index: 200;

            padding: 12px 18px;

            border-radius: 12px;

            background:
                rgba(28,33,59,0.95);

            border:
                1px solid rgba(255,255,255,0.08);

            color: #ffffff;

            font-size: 13px;

            transition:
                opacity 0.25s,
                transform 0.25s;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* ================================
           RWD
           ================================ */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 4%;
            }

            .brand-name {
                font-size: 15px;
            }

            .article-card {
                padding: 22px;
            }

            .comments-section {
                padding: 20px;
            }

            .comment-form {
                flex-direction: column;
            }

            .comment-submit {
                align-self: stretch;
            }

            .article-actions {
                flex-wrap: wrap;
            }

            .report-button {
                margin-left: 0;
            }

        }

    </style>
</head>

<body>

    <!-- ================================
         導覽列
         ================================ -->

    <nav class="navbar">

        <div
            class="brand"
            id="brandButton"
        >

            <div class="brand-icon">
                💻
            </div>

            <div class="brand-name">
                資訊系談心閣
            </div>

        </div>


        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            ← 返回首頁
        </button>

    </nav>


    <!-- ================================
         主內容
         ================================ -->

    <main class="container">

        <div id="articleContainer"></div>

    </main>


    <!-- ================================
         檢舉 Modal
         ================================ -->

    <div
        class="modal"
        id="reportModal"
    >

        <div class="modal-box">

            <div class="modal-title">
                🚩 檢舉這篇文章
            </div>


            <div id="reportOptions">

                <label class="report-option">
                    <input
                        type="radio"
                        name="reportReason"
                        value="垃圾訊息"
                    >
                    垃圾訊息
                </label>


                <label class="report-option">
                    <input
                        type="radio"
                        name="reportReason"
                        value="不當內容"
                    >
                    不當內容
                </label>


                <label class="report-option">
                    <input
                        type="radio"
                        name="reportReason"
                        value="騷擾"
                    >
                    騷擾
                </label>


                <label class="report-option">
                    <input
                        type="radio"
                        name="reportReason"
                        value="錯誤資訊"
                    >
                    錯誤資訊
                </label>


                <label class="report-option">
                    <input
                        type="radio"
                        name="reportReason"
                        value="其他"
                    >
                    其他
                </label>

            </div>


            <textarea
                id="reportDetail"
                class="report-detail"
                maxlength="500"
                placeholder="可以補充檢舉原因（選填）"
            ></textarea>


            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-button cancel-button"
                    id="cancelReport"
                >
                    取消
                </button>


                <button
                    type="button"
                    class="modal-button submit-report"
                    id="submitReport"
                >
                    送出檢舉
                </button>

            </div>

        </div>

    </div>


    <!-- Toast -->

    <div
        class="toast"
        id="toast"
    ></div>


<script>

    /* =====================================================
       登入資訊
       ===================================================== */

    const loginUser =
        sessionStorage.getItem("loginUser") ||
        localStorage.getItem("loginUser") ||
        "student";

    const userRole =
        sessionStorage.getItem("userRole") ||
        localStorage.getItem("userRole") ||
        "user";


    /* =====================================================
       localStorage Keys
       ===================================================== */

    const POSTS_KEY =
        "talkingHallPosts";

    const COMMENTS_KEY =
        "talkingHallComments";

    const REPORTS_KEY =
        "talkingHallReports";


    /* =====================================================
       取得文章 ID
       ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const postId =
        params.get("id");


    /* =====================================================
       DOM
       ===================================================== */

    const articleContainer =
        document.getElementById(
            "articleContainer"
        );

    const backButton =
        document.getElementById(
            "backButton"
        );

    const brandButton =
        document.getElementById(
            "brandButton"
        );

    const reportModal =
        document.getElementById(
            "reportModal"
        );

    const cancelReport =
        document.getElementById(
            "cancelReport"
        );

    const submitReport =
        document.getElementById(
            "submitReport"
        );

    const reportDetail =
        document.getElementById(
            "reportDetail"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       安全 JSON 讀取
       ===================================================== */

    function readJSON(key, fallback) {

        try {

            const raw =
                localStorage.getItem(key);

            if (!raw) {

                return fallback;

            }

            const parsed =
                JSON.parse(raw);

            return parsed;

        } catch (error) {

            console.warn(
                "資料讀取失敗：",
                key,
                error
            );

            return fallback;

        }

    }


    /* =====================================================
       取得文章
       ===================================================== */

    function getPosts() {

        const posts =
            readJSON(
                POSTS_KEY,
                []
            );

        if (!Array.isArray(posts)) {

            return [];

        }

        return posts;

    }


    function getPost() {

        if (!postId) {

            return null;

        }


        const posts =
            getPosts();


        return posts.find(
            function(post) {

                return String(post.id) ===
                       String(postId);

            }
        ) || null;

    }


    /* =====================================================
       Toast
       ===================================================== */

    let toastTimer = null;


    function showToast(message) {

        toast.textContent =
            message;

        toast.classList.add("show");


        clearTimeout(toastTimer);


        toastTimer =
            setTimeout(
                function() {

                    toast.classList.remove(
                        "show"
                    );

                },
                2200
            );

    }


    /* =====================================================
       日期格式
       ===================================================== */

    function formatDate(dateString) {

        const date =
            new Date(dateString);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "未知時間";

        }


        return date.toLocaleString(
            "zh-TW",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* =====================================================
       分類名稱
       ===================================================== */

    function getCategoryName(category) {

        const map = {

            "程式": "💻 程式",

            "課業": "📚 課業",

            "遊戲": "🎮 遊戲",

            "閒聊": "💬 閒聊",

            "心情": "❤️ 心情"

        };


        return map[category] ||
               "💬 其他";

    }


    /* =====================================================
       建立文章
       ===================================================== */

    function renderArticle(post) {

        articleContainer.innerHTML = "";


        const card =
            document.createElement(
                "article"
            );

        card.className =
            "article-card";


        const category =
            document.createElement(
                "div"
            );

        category.className =
            "category";

        category.textContent =
            getCategoryName(
                post.category
            );


        const title =
            document.createElement(
                "h1"
            );

        title.className =
            "article-title";

        /*
         * 重要：
         * 使用 textContent
         * 而不是 innerHTML
         */

        title.textContent =
            post.title || "無標題";


        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "article-meta";


        const author =
            document.createElement(
                "span"
            );

        author.className =
            "author";

        author.textContent =
            post.author ||
            "匿名使用者";


        const separator =
            document.createElement(
                "span"
            );

        separator.textContent =
            "·";


        const time =
            document.createElement(
                "span"
            );

        time.textContent =
            formatDate(
                post.createdAt
            );


        meta.appendChild(author);

        meta.appendChild(separator);

        meta.appendChild(time);


        const content =
            document.createElement(
                "div"
            );

        content.className =
            "article-content";

        /*
         * 使用 textContent
         * 使用者輸入的 HTML 只會被當成文字
         */

        content.textContent =
            post.content || "";


        const actions =
            document.createElement(
                "div"
            );

        actions.className =
            "article-actions";


        const likeButton =
            document.createElement(
                "button"
            );

        likeButton.type =
            "button";

        likeButton.className =
            "action-button like-button";


        const likedKey =
            "liked_" + String(post.id);


        let liked =
            localStorage.getItem(
                likedKey
            ) === "true";


        function updateLikeButton() {

            likeButton.classList.toggle(
                "liked",
                liked
            );


            likeButton.textContent =
                liked
                    ? `❤️ 已按讚 ${Number(post.likes) || 0}`
                    : `🤍 讚 ${Number(post.likes) || 0}`;

        }


        updateLikeButton();


        likeButton.addEventListener(
            "click",
            function() {

                liked = !liked;


                let likes =
                    Number(post.likes);


                if (
                    !Number.isFinite(likes) ||
                    likes < 0
                ) {

                    likes = 0;

                }


                if (liked) {

                    likes++;

                } else {

                    likes =
                        Math.max(
                            0,
                            likes - 1
                        );

                }


                post.likes =
                    likes;


                localStorage.setItem(
                    POSTS_KEY,
                    JSON.stringify(
                        getPosts().map(
                            function(item) {

                                if (
                                    String(item.id) ===
                                    String(post.id)
                                ) {

                                    return post;

                                }

                                return item;

                            }
                        )
                    )
                );


                localStorage.setItem(
                    likedKey,
                    String(liked)
                );


                updateLikeButton();

            }
        );


        const commentCount =
            document.createElement(
                "span"
            );

        commentCount.className =
            "action-button";

        commentCount.textContent =
            `💬 ${Number(post.comments) || 0} 則留言`;


        const reportButton =
            document.createElement(
                "button"
            );

        reportButton.type =
            "button";

        reportButton.className =
            "action-button report-button";

        reportButton.textContent =
            "🚩 檢舉";


        reportButton.addEventListener(
            "click",
            openReportModal
        );


        actions.appendChild(
            likeButton
        );

        actions.appendChild(
            commentCount
        );

        actions.appendChild(
            reportButton
        );


        card.appendChild(
            category
        );

        card.appendChild(
            title
        );

        card.appendChild(
            meta
        );

        card.appendChild(
            content
        );

        card.appendChild(
            actions
        );


        articleContainer.appendChild(
            card
        );


        renderComments();

    }


    /* =====================================================
       找不到文章
       ===================================================== */

    function renderNotFound() {

        articleContainer.innerHTML = "";


        const box =
            document.createElement(
                "div"
            );

        box.className =
            "not-found";


        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "not-found-icon";

        icon.textContent =
            "📭";


        const title =
            document.createElement(
                "h2"
            );

        title.textContent =
            "找不到這篇文章";


        const text =
            document.createElement(
                "p"
            );

        text.textContent =
            "文章可能已經被刪除，或網址不存在。";


        const button =
            document.createElement(
                "button"
            );

        button.className =
            "action-button";

        button.textContent =
            "返回首頁";

        button.addEventListener(
            "click",
            goHome
        );


        box.appendChild(icon);

        box.appendChild(title);

        box.appendChild(text);

        box.appendChild(button);


        articleContainer.appendChild(
            box
        );

    }


    /* =====================================================
       留言資料
       ===================================================== */

    function getComments() {

        const comments =
            readJSON(
                COMMENTS_KEY,
                []
            );


        if (!Array.isArray(comments)) {

            return [];

        }


        return comments;

    }


    /* =====================================================
       建立留言區
       ===================================================== */

    function renderComments() {

        const existing =
            document.querySelector(
                ".comments-section"
            );


        if (existing) {

            existing.remove();

        }


        const section =
            document.createElement(
                "section"
            );

        section.className =
            "comments-section";


        const title =
            document.createElement(
                "h2"
            );

        title.className =
            "section-title";

        title.textContent =
            "💬 留言區";


        /* ============================
           留言輸入
           ============================ */

        const form =
            document.createElement(
                "form"
            );

        form.className =
            "comment-form";


        const input =
            document.createElement(
                "textarea"
            );

        input.className =
            "comment-input";

        input.maxLength =
            500;

        input.placeholder =
            "留下你的想法……";


        const submit =
            document.createElement(
                "button"
            );

        submit.type =
            "submit";

        submit.className =
            "comment-submit";

        submit.textContent =
            "留言";


        form.appendChild(
            input
        );

        form.appendChild(
            submit
        );


        /* ============================
           留言列表
           ============================ */

        const list =
            document.createElement(
                "div"
            );

        list.className =
            "comment-list";


        const comments =
            getComments().filter(
                function(comment) {

                    return String(
                        comment.postId
                    ) === String(postId);

                }
            );


        if (comments.length === 0) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty-comment";

            empty.textContent =
                "目前還沒有留言，成為第一個留言的人吧。";


            list.appendChild(
                empty
            );

        } else {

            comments.forEach(
                function(comment) {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "comment";


                    const header =
                        document.createElement(
                            "div"
                        );

                    header.className =
                        "comment-header";


                    const author =
                        document.createElement(
                            "span"
                        );

                    author.className =
                        "comment-author";

                    author.textContent =
                        comment.author ||
                        "匿名使用者";


                    const time =
                        document.createElement(
                            "span"
                        );

                    time.className =
                        "comment-time";

                    time.textContent =
                        formatDate(
                            comment.createdAt
                        );


                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "comment-content";


                    /*
                     * 關鍵安全處理
                     *
                     * 絕對不使用：
                     *
                     * content.innerHTML = comment.content
                     *
                     * 而是 textContent
                     */

                    content.textContent =
                        comment.content || "";


                    header.appendChild(
                        author
                    );

                    header.appendChild(
                        time
                    );


                    item.appendChild(
                        header
                    );

                    item.appendChild(
                        content
                    );


                    list.appendChild(
                        item
                    );

                }
            );

        }


        /* ============================
           送出留言
           ============================ */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const content =
                    input.value.trim();


                if (!content) {

                    showToast(
                        "請輸入留言內容。"
                    );

                    input.focus();

                    return;

                }


                if (content.length > 500) {

                    showToast(
                        "留言最多 500 字。"
                    );

                    return;

                }


                const comments =
                    getComments();


                comments.push({

                    id:
                        Date.now().toString(),

                    postId:
                        String(postId),

                    author:
                        loginUser,

                    content:
                        content,

                    createdAt:
                        new Date().toISOString()

                });


                localStorage.setItem(
                    COMMENTS_KEY,
                    JSON.stringify(
                        comments
                    )
                );


                /*
                 * 更新文章留言數
                 */

                const posts =
                    getPosts();


                const index =
                    posts.findIndex(
                        function(item) {

                            return String(
                                item.id
                            ) ===
                            String(postId);

                        }
                    );


                if (index !== -1) {

                    let count =
                        Number(
                            posts[index].comments
                        );


                    if (
                        !Number.isFinite(count) ||
                        count < 0
                    ) {

                        count = 0;

                    }


                    posts[index].comments =
                        count + 1;


                    localStorage.setItem(
                        POSTS_KEY,
                        JSON.stringify(
                            posts
                        )
                    );

                }


                input.value = "";


                showToast(
                    "留言成功！"
                );


                renderComments();

            }
        );


        section.appendChild(
            title
        );

        section.appendChild(
            form
        );

        section.appendChild(
            list
        );


        articleContainer.appendChild(
            section
        );

    }


    /* =====================================================
       檢舉
       ===================================================== */

    function openReportModal() {

        reportModal.classList.add(
            "show"
        );

        reportDetail.value = "";


        document
            .querySelectorAll(
                'input[name="reportReason"]'
            )
            .forEach(
                function(input) {

                    input.checked = false;

                }
            );

    }


    function closeReportModal() {

        reportModal.classList.remove(
            "show"
        );

    }


    submitReport.addEventListener(
        "click",
        function() {

            const selected =
                document.querySelector(
                    'input[name="reportReason"]:checked'
                );


            if (!selected) {

                showToast(
                    "請選擇檢舉原因。"
                );

                return;

            }


            const detail =
                reportDetail.value.trim();


            if (detail.length > 500) {

                showToast(
                    "補充內容最多 500 字。"
                );

                return;

            }


            const reports =
                readJSON(
                    REPORTS_KEY,
                    []
                );


            const safeReports =
                Array.isArray(reports)
                    ? reports
                    : [];


            /*
             * 同一個使用者對同一篇文章
             * 如果已經有待處理檢舉
             * 就不允許重複提交
             */

            const alreadyReported =
                safeReports.some(
                    function(report) {

                        return String(
                            report.postId
                        ) === String(postId)
                        &&
                        String(
                            report.reporter
                        ) === String(loginUser)
                        &&
                        report.status ===
                            "pending";

                    }
                );


            if (alreadyReported) {

                closeReportModal();

                showToast(
                    "你已經檢舉過這篇文章，請等待管理員處理。"
                );

                return;

            }


            const post =
                getPost();


            if (!post) {

                closeReportModal();

                showToast(
                    "文章不存在。"
                );

                return;

            }


            safeReports.push({

                id:
                    Date.now().toString(),

                postId:
                    String(post.id),

                postTitle:
                    String(post.title || ""),

                reporter:
                    loginUser,

                reason:
                    selected.value,

                detail:
                    detail,

                status:
                    "pending",

                createdAt:
                    new Date().toISOString()

            });


            localStorage.setItem(
                REPORTS_KEY,
                JSON.stringify(
                    safeReports
                )
            );


            closeReportModal();


            showToast(
                "檢舉已送出，等待管理員處理。"
            );

        }
    );


    cancelReport.addEventListener(
        "click",
        closeReportModal
    );


    /*
     * 點擊 Modal 外部關閉
     */

    reportModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                reportModal
            ) {

                closeReportModal();

            }

        }
    );


    /*
     * ESC 關閉
     */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeReportModal();

            }

        }
    );


    /* =====================================================
       返回首頁
       ===================================================== */

    function goHome() {

        window.location.href =
            "./home.html";

    }


    backButton.addEventListener(
        "click",
        goHome
    );


    brandButton.addEventListener(
        "click",
        goHome
    );


    /* =====================================================
       啟動
       ===================================================== */

    const post =
        getPost();


    if (post) {

        renderArticle(post);

    } else {

        renderNotFound();

    }

</script>

</body>
</html>

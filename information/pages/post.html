<!DOCTYPE html>
<html lang="zh-Hant">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#5865f2">

    <title>發表文章｜資訊系談心閣</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(95,110,255,0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(160,90,255,0.12),
                    transparent 35%
                ),

                #101426;

            color: #f4f6ff;

            padding-bottom: 50px;
        }


        /* =========================
           導覽列
           ========================= */

        .navbar {

            position: sticky;

            top: 0;

            z-index: 50;

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            background:
                rgba(16,20,38,0.88);

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

            cursor: pointer;
        }


        .brand-icon {

            width: 38px;

            height: 38px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #6675ff,
                    #8667e8
                );

            font-size: 19px;
        }


        .brand-name {

            font-size: 17px;

            font-weight: 800;
        }


        .back-button {

            border: none;

            padding: 10px 15px;

            border-radius: 11px;

            background:
                rgba(255,255,255,0.06);

            color: #dce1f7;

            cursor: pointer;

            transition: 0.2s;
        }


        .back-button:hover {

            background:
                rgba(255,255,255,0.11);
        }


        /* =========================
           主容器
           ========================= */

        .container {

            width: min(850px, 92%);

            margin: 32px auto;
        }


        .page-header {

            margin-bottom: 20px;
        }


        .page-header h1 {

            font-size: 29px;

            margin-bottom: 7px;
        }


        .page-header p {

            color: #838ba8;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================
           發文卡片
           ========================= */

        .post-card {

            background:
                rgba(25,30,55,0.88);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 22px;

            padding: 28px;

            box-shadow:
                0 20px 55px rgba(0,0,0,0.25);
        }


        .form-group {

            margin-bottom: 23px;
        }


        .form-label {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 9px;

            color: #e3e7f7;

            font-size: 14px;

            font-weight: 800;
        }


        .counter {

            color: #6f7897;

            font-size: 11px;

            font-weight: 500;
        }


        .counter.warning {

            color: #ffad73;
        }


        .counter.danger {

            color: #ff7373;
        }


        /* =========================
           分類
           ========================= */

        .category-grid {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 9px;
        }


        .category-option {

            position: relative;
        }


        .category-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .category-option label {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 48px;

            padding: 8px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(255,255,255,0.035);

            color: #aeb5d0;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;

            text-align: center;
        }


        .category-option label:hover {

            background:
                rgba(255,255,255,0.07);

            color: #ffffff;
        }


        .category-option input:checked + label {

            background:
                rgba(103,118,255,0.17);

            border-color:
                rgba(112,127,255,0.65);

            color: #b9c1ff;

            box-shadow:
                0 0 0 2px
                rgba(103,118,255,0.07);
        }


        /* =========================
           輸入框
           ========================= */

        .text-input,
        .content-input {

            width: 100%;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 13px;

            background:
                rgba(10,14,30,0.75);

            color: #ffffff;

            padding: 13px 14px;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            transition: 0.2s;
        }


        .text-input {

            height: 52px;
        }


        .content-input {

            min-height: 260px;

            resize: vertical;

            line-height: 1.8;
        }


        .text-input:focus,
        .content-input:focus {

            border-color:
                #7180ff;

            box-shadow:
                0 0 0 3px
                rgba(113,128,255,0.10);
        }


        .text-input::placeholder,
        .content-input::placeholder {

            color: #68718e;
        }


        /* =========================
           匿名
           ========================= */

        .anonymous-box {

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 15px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.06);

            cursor: pointer;
        }


        .anonymous-box input {

            width: 18px;

            height: 18px;

            accent-color:
                #6877ff;

            cursor: pointer;
        }


        .anonymous-text strong {

            display: block;

            margin-bottom: 3px;

            color: #e0e5f5;

            font-size: 13px;
        }


        .anonymous-text span {

            color: #747d9b;

            font-size: 11px;
        }


        /* =========================
           提示
           ========================= */

        .notice {

            padding: 13px 14px;

            margin-bottom: 22px;

            border-radius: 13px;

            background:
                rgba(105,120,255,0.07);

            border:
                1px solid rgba(105,120,255,0.10);

            color: #929bc0;

            font-size: 12px;

            line-height: 1.7;
        }


        /* =========================
           錯誤
           ========================= */

        .error-box {

            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 12px;

            background:
                rgba(255,70,70,0.10);

            border:
                1px solid rgba(255,70,70,0.18);

            color: #ff9b9b;

            font-size: 12px;

            line-height: 1.6;
        }


        .error-box.show {

            display: block;
        }


        /* =========================
           按鈕
           ========================= */

        .actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 5px;
        }


        .button {

            min-width: 110px;

            height: 48px;

            border: none;

            border-radius: 12px;

            padding: 0 18px;

            font-family: inherit;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }


        .cancel-button {

            background:
                rgba(255,255,255,0.06);

            color: #bfc6dd;
        }


        .cancel-button:hover {

            background:
                rgba(255,255,255,0.10);
        }


        .submit-button {

            background:
                linear-gradient(
                    135deg,
                    #6675ff,
                    #8069e8
                );

            color: #ffffff;

            box-shadow:
                0 9px 24px
                rgba(100,115,255,0.22);
        }


        .submit-button:hover {

            filter: brightness(1.08);

            transform:
                translateY(-1px);
        }


        .submit-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;

            filter: none;
        }


        /* =========================
           Toast
           ========================= */

        .toast {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translate(-50%,20px);

            opacity: 0;

            pointer-events: none;

            z-index: 100;

            padding: 12px 18px;

            border-radius: 12px;

            background:
                rgba(28,33,59,0.95);

            border:
                1px solid rgba(255,255,255,0.08);

            color: #ffffff;

            font-size: 13px;

            transition:
                opacity 0.25s,
                transform 0.25s;
        }


        .toast.show {

            opacity: 1;

            transform:
                translate(-50%,0);
        }


        /* =========================
           RWD
           ========================= */

        @media (max-width: 650px) {

            .navbar {

                padding: 0 4%;
            }


            .brand-name {

                font-size: 15px;
            }


            .container {

                width: 94%;

                margin-top: 23px;
            }


            .post-card {

                padding: 21px;
            }


            .category-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .content-input {

                min-height: 230px;
            }


            .actions {

                flex-direction: column-reverse;
            }


            .button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         導覽列
         ========================= -->

    <nav class="navbar">

        <div
            class="brand"
            id="brandButton"
        >

            <div class="brand-icon">
                💻
            </div>

            <div class="brand-name">
                資訊系談心閣
            </div>

        </div>


        <button
            type="button"
            class="back-button"
            id="backButton"
        >
            ← 返回首頁
        </button>

    </nav>



    <!-- =========================
         主內容
         ========================= -->

    <main class="container">


        <header class="page-header">

            <h1>
                發表文章
            </h1>

            <p>
                分享程式、課業、遊戲、生活或最近的心情。
            </p>

        </header>



        <section class="post-card">


            <form
                id="postForm"
                novalidate
            >


                <!-- 分類 -->

                <div class="form-group">

                    <div class="form-label">

                        <span>
                            文章分類
                        </span>

                        <span class="counter">
                            必填
                        </span>

                    </div>


                    <div class="category-grid">


                        <div class="category-option">

                            <input
                                type="radio"
                                id="category-code"
                                name="category"
                                value="程式"
                            >

                            <label for="category-code">
                                💻 程式
                            </label>

                        </div>


                        <div class="category-option">

                            <input
                                type="radio"
                                id="category-study"
                                name="category"
                                value="課業"
                            >

                            <label for="category-study">
                                📚 課業
                            </label>

                        </div>


                        <div class="category-option">

                            <input
                                type="radio"
                                id="category-game"
                                name="category"
                                value="遊戲"
                            >

                            <label for="category-game">
                                🎮 遊戲
                            </label>

                        </div>


                        <div class="category-option">

                            <input
                                type="radio"
                                id="category-chat"
                                name="category"
                                value="閒聊"
                            >

                            <label for="category-chat">
                                💬 閒聊
                            </label>

                        </div>


                        <div class="category-option">

                            <input
                                type="radio"
                                id="category-mood"
                                name="category"
                                value="心情"
                            >

                            <label for="category-mood">
                                ❤️ 心情
                            </label>

                        </div>


                    </div>

                </div>



                <!-- 標題 -->

                <div class="form-group">

                    <div class="form-label">

                        <label for="title">
                            文章標題
                        </label>

                        <span
                            class="counter"
                            id="titleCounter"
                        >
                            0 / 80
                        </span>

                    </div>


                    <input
                        id="title"
                        class="text-input"
                        type="text"
                        maxlength="80"
                        autocomplete="off"
                        placeholder="例如：有人也覺得 C++ 指標很難嗎？"
                    >

                </div>



                <!-- 內容 -->

                <div class="form-group">

                    <div class="form-label">

                        <label for="content">
                            文章內容
                        </label>

                        <span
                            class="counter"
                            id="contentCounter"
                        >
                            0 / 3000
                        </span>

                    </div>


                    <textarea
                        id="content"
                        class="content-input"
                        maxlength="3000"
                        placeholder="把想分享的內容寫在這裡……"
                    ></textarea>

                </div>



                <!-- 匿名 -->

                <div class="form-group">

                    <label class="anonymous-box">

                        <input
                            type="checkbox"
                            id="anonymous"
                        >

                        <span class="anonymous-text">

                            <strong>
                                匿名發表
                            </strong>

                            <span>
                                其他使用者將看不到登入帳號
                            </span>

                        </span>

                    </label>

                </div>



                <!-- 提示 -->

                <div class="notice">

                    🔒
                    請勿在文章中公開密碼、個人聯絡方式或其他敏感資訊。
                    發表後仍可以透過檢舉功能回報不當內容。

                </div>



                <!-- 錯誤 -->

                <div
                    id="errorBox"
                    class="error-box"
                ></div>



                <!-- 按鈕 -->

                <div class="actions">

                    <button
                        type="button"
                        class="button cancel-button"
                        id="cancelButton"
                    >
                        取消
                    </button>


                    <button
                        type="submit"
                        class="button submit-button"
                        id="submitButton"
                    >
                        發表文章
                    </button>

                </div>


            </form>


        </section>


    </main>



    <div
        class="toast"
        id="toast"
    ></div>



<script>


    /* =====================================================
       登入資訊
       ===================================================== */

    const loginUser =
        sessionStorage.getItem("loginUser") ||
        localStorage.getItem("loginUser") ||
        "student";


    const userRole =
        sessionStorage.getItem("userRole") ||
        localStorage.getItem("userRole") ||
        "user";


    /* =====================================================
       設定
       ===================================================== */

    const POSTS_KEY =
        "talkingHallPosts";


    const MAX_TITLE_LENGTH =
        80;


    const MAX_CONTENT_LENGTH =
        3000;


    const MIN_TITLE_LENGTH =
        2;


    const MIN_CONTENT_LENGTH =
        5;


    /* =====================================================
       DOM
       ===================================================== */

    const form =
        document.getElementById(
            "postForm"
        );


    const titleInput =
        document.getElementById(
            "title"
        );


    const contentInput =
        document.getElementById(
            "content"
        );


    const anonymousInput =
        document.getElementById(
            "anonymous"
        );


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    const cancelButton =
        document.getElementById(
            "cancelButton"
        );


    const backButton =
        document.getElementById(
            "backButton"
        );


    const brandButton =
        document.getElementById(
            "brandButton"
        );


    const titleCounter =
        document.getElementById(
            "titleCounter"
        );


    const contentCounter =
        document.getElementById(
            "contentCounter"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       JSON 讀取
       ===================================================== */

    function getPosts() {

        try {

            const raw =
                localStorage.getItem(
                    POSTS_KEY
                );


            if (!raw) {

                return [];

            }


            const data =
                JSON.parse(raw);


            if (!Array.isArray(data)) {

                return [];

            }


            return data;

        } catch (error) {

            console.warn(
                "文章資料讀取失敗",
                error
            );


            return [];

        }

    }


    /* =====================================================
       顯示錯誤
       ===================================================== */

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function hideError() {

        errorBox.textContent =
            "";

        errorBox.classList.remove(
            "show"
        );

    }


    /* =====================================================
       Toast
       ===================================================== */

    let toastTimer = null;


    function showToast(message) {

        toast.textContent =
            message;

        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                function() {

                    toast.classList.remove(
                        "show"
                    );

                },
                2200
            );

    }


    /* =====================================================
       字數計算
       ===================================================== */

    function updateCounters() {

        const titleLength =
            titleInput.value.length;


        const contentLength =
            contentInput.value.length;


        titleCounter.textContent =
            `${titleLength} / ${MAX_TITLE_LENGTH}`;


        contentCounter.textContent =
            `${contentLength} / ${MAX_CONTENT_LENGTH}`;


        titleCounter.classList.remove(
            "warning",
            "danger"
        );


        contentCounter.classList.remove(
            "warning",
            "danger"
        );


        if (
            titleLength >=
            MAX_TITLE_LENGTH * 0.8
        ) {

            titleCounter.classList.add(
                "warning"
            );

        }


        if (
            titleLength >=
            MAX_TITLE_LENGTH * 0.95
        ) {

            titleCounter.classList.remove(
                "warning"
            );

            titleCounter.classList.add(
                "danger"
            );

        }


        if (
            contentLength >=
            MAX_CONTENT_LENGTH * 0.8
        ) {

            contentCounter.classList.add(
                "warning"
            );

        }


        if (
            contentLength >=
            MAX_CONTENT_LENGTH * 0.95
        ) {

            contentCounter.classList.remove(
                "warning"
            );

            contentCounter.classList.add(
                "danger"
            );

        }

    }


    titleInput.addEventListener(
        "input",
        function() {

            updateCounters();

            hideError();

        }
    );


    contentInput.addEventListener(
        "input",
        function() {

            updateCounters();

            hideError();

        }
    );


    /* =====================================================
       取得分類
       ===================================================== */

    function getSelectedCategory() {

        const selected =
            document.querySelector(
                'input[name="category"]:checked'
            );


        return selected
            ? selected.value
            : "";

    }


    /* =====================================================
       基本字串清理
       ===================================================== */

    function cleanText(value) {

        /*
         * trim：
         * 移除頭尾多餘空白
         */

        return String(
            value || ""
        ).trim();

    }


    /* =====================================================
       建立唯一 ID
       ===================================================== */

    function createPostId() {

        /*
         * Date.now() +
         * 隨機字串
         *
         * 避免同一毫秒建立兩篇文章時 ID 相同
         */

        return (
            Date.now().toString() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2, 9)
        );

    }


    /* =====================================================
       驗證文章
       ===================================================== */

    function validatePost() {

        const category =
            getSelectedCategory();


        const title =
            cleanText(
                titleInput.value
            );


        const content =
            cleanText(
                contentInput.value
            );


        /* 分類 */

        if (!category) {

            showError(
                "請先選擇文章分類。"
            );

            return false;

        }


        /* 標題 */

        if (!title) {

            showError(
                "請輸入文章標題。"
            );

            titleInput.focus();

            return false;

        }


        if (
            title.length <
            MIN_TITLE_LENGTH
        ) {

            showError(
                `文章標題至少需要 ${MIN_TITLE_LENGTH} 個字。`
            );

            titleInput.focus();

            return false;

        }


        if (
            title.length >
            MAX_TITLE_LENGTH
        ) {

            showError(
                `文章標題最多 ${MAX_TITLE_LENGTH} 個字。`
            );

            titleInput.focus();

            return false;

        }


        /* 內容 */

        if (!content) {

            showError(
                "請輸入文章內容。"
            );

            contentInput.focus();

            return false;

        }


        if (
            content.length <
            MIN_CONTENT_LENGTH
        ) {

            showError(
                `文章內容至少需要 ${MIN_CONTENT_LENGTH} 個字。`
            );

            contentInput.focus();

            return false;

        }


        if (
            content.length >
            MAX_CONTENT_LENGTH
        ) {

            showError(
                `文章內容最多 ${MAX_CONTENT_LENGTH} 個字。`
            );

            contentInput.focus();

            return false;

        }


        return true;

    }


    /* =====================================================
       發表文章
       ===================================================== */

    let submitting = false;


    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            /*
             * 防止使用者連續快速按下發表
             */

            if (submitting) {

                return;

            }


            hideError();


            /* 驗證 */

            if (!validatePost()) {

                return;

            }


            submitting = true;

            submitButton.disabled =
                true;

            submitButton.textContent =
                "發表中…";


            /*
             * 重新讀取資料
             *
             * 不使用頁面載入時的舊資料
             */

            const posts =
                getPosts();


            const category =
                getSelectedCategory();


            const title =
                cleanText(
                    titleInput.value
                );


            const content =
                cleanText(
                    contentInput.value
                );


            const anonymous =
                anonymousInput.checked;


            /*
             * 建立文章
             *
             * 注意：
             *
             * 使用者輸入的 title / content
             * 只是字串資料。
             *
             * 後面顯示文章時會使用 textContent，
             * 不會直接使用 innerHTML。
             */

            const newPost = {

                id:
                    createPostId(),

                title:
                    title,

                content:
                    content,

                category:
                    category,

                author:
                    anonymous
                        ? "匿名使用者"
                        : loginUser,

                owner:
                    loginUser,

                anonymous:
                    anonymous,

                likes:
                    0,

                comments:
                    0,

                createdAt:
                    new Date().toISOString()

            };


            posts.push(
                newPost
            );


            /*
             * 儲存
             */

            try {

                localStorage.setItem(
                    POSTS_KEY,
                    JSON.stringify(
                        posts
                    )
                );

            } catch (error) {

                console.error(
                    "文章儲存失敗",
                    error
                );


                submitting = false;

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "發表文章";


                showError(
                    "文章儲存失敗，可能是瀏覽器儲存空間不足。"
                );

                return;

            }


            /*
             * 成功
             */

            showToast(
                "文章發表成功！"
            );


            /*
             * 延遲跳轉
             */

            setTimeout(
                function() {

                    window.location.href =
                        "./home.html";

                },
                450
            );

        }
    );


    /* =====================================================
       返回首頁
       ===================================================== */

    function goHome() {

        window.location.href =
            "./home.html";

    }


    cancelButton.addEventListener(
        "click",
        goHome
    );


    backButton.addEventListener(
        "click",
        goHome
    );


    brandButton.addEventListener(
        "click",
        goHome
    );


    /* =====================================================
       Ctrl + Enter / Enter 行為
       ===================================================== */

    contentInput.addEventListener(
        "keydown",
        function(event) {

            /*
             * Ctrl + Enter
             * 可以直接發表
             */

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                form.requestSubmit();

            }

        }
    );


    /* =====================================================
       初始化
       ===================================================== */

    updateCounters();


</script>

</body>
</html>

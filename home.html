<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>資訊系談心閣</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef4ff 0%,
            #f6f2ff 50%,
            #fff7fb 100%
        );

    color: #27324a;
    min-height: 100vh;
}

/* =========================
   導覽列
========================= */

.navbar {
    height: 68px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(120,140,180,0.15);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #7298ff,
            #8c72e8
        );

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 20px;
    font-weight: 800;

    box-shadow:
        0 8px 20px rgba(100,120,220,0.25);
}

.logo-text h1 {
    font-size: 17px;
    font-weight: 800;
}

.logo-text p {
    font-size: 11px;
    color: #8c96aa;
    margin-top: 2px;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-info {
    background: #f4f6fb;
    border-radius: 14px;
    padding: 8px 13px;

    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
}

.avatar {
    width: 29px;
    height: 29px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #8daeff,
            #8e7de8
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: 700;
}

.role {
    color: #8a94a8;
    font-size: 11px;
}

.logout-btn {
    border: none;
    background: #eef1f8;
    color: #657087;

    padding: 9px 14px;
    border-radius: 12px;

    cursor: pointer;
    transition: 0.2s;
}

.logout-btn:hover {
    background: #e4e8f2;
}

/* =========================
   主容器
========================= */

.container {
    width: min(1250px, 92%);
    margin: 28px auto 60px;

    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;

    gap: 25px;
}

/* =========================
   歡迎區
========================= */

.welcome {
    background:
        linear-gradient(
            135deg,
            #789cff,
            #887be8
        );

    border-radius: 24px;

    padding: 30px;

    color: white;

    box-shadow:
        0 15px 35px rgba(105,120,220,0.2);

    margin-bottom: 20px;

    position: relative;
    overflow: hidden;
}

.welcome::after {
    content: "";

    position: absolute;

    width: 190px;
    height: 190px;

    right: -60px;
    top: -70px;

    border-radius: 50%;

    background: rgba(255,255,255,0.1);
}

.welcome h2 {
    font-size: 25px;
    margin-bottom: 9px;
    position: relative;
    z-index: 1;
}

.welcome p {
    font-size: 14px;
    opacity: 0.9;
    position: relative;
    z-index: 1;
}

/* =========================
   分類
========================= */

.category-bar {
    background: rgba(255,255,255,0.9);

    border-radius: 18px;

    padding: 10px;

    display: flex;
    gap: 7px;

    overflow-x: auto;

    margin-bottom: 15px;

    border: 1px solid rgba(120,140,180,0.12);
}

.category-bar::-webkit-scrollbar {
    display: none;
}

.category-btn {
    border: none;
    background: transparent;

    color: #7a8498;

    padding: 10px 15px;

    border-radius: 12px;

    white-space: nowrap;

    cursor: pointer;

    font-size: 13px;

    transition: 0.2s;
}

.category-btn:hover {
    background: #f0f3fa;
}

.category-btn.active {
    background: #7898f4;
    color: white;

    box-shadow:
        0 5px 12px rgba(100,130,230,0.2);
}

/* =========================
   排序
========================= */

.sort-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;

    margin-bottom: 13px;
}

.sort-btn {
    border: none;
    background: white;

    color: #7d879a;

    padding: 8px 13px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 12px;
}

.sort-btn.active {
    color: #617fe0;
    background: #edf1ff;
}

/* =========================
   文章
========================= */

.post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.post-card {
    background: rgba(255,255,255,0.95);

    border-radius: 19px;

    padding: 21px;

    border: 1px solid rgba(120,140,180,0.12);

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s,
        border-color 0.2s;

    box-shadow:
        0 5px 20px rgba(60,80,130,0.04);
}

.post-card:hover {
    transform: translateY(-2px);

    border-color: rgba(110,140,230,0.3);

    box-shadow:
        0 12px 28px rgba(60,80,130,0.1);
}

.post-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;
}

.post-category {
    font-size: 11px;

    color: #6785d9;

    background: #edf1ff;

    padding: 5px 9px;

    border-radius: 8px;
}

.post-time {
    color: #a0a8b8;
    font-size: 11px;
}

.post-title {
    font-size: 18px;
    color: #303a51;

    font-weight: 800;

    margin-bottom: 9px;

    line-height: 1.5;
}

.post-preview {
    color: #7c8699;

    font-size: 13px;

    line-height: 1.7;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;

    margin-bottom: 16px;
}

.post-bottom {
    display: flex;
    align-items: center;

    gap: 15px;

    color: #929bad;

    font-size: 12px;
}

.post-author {
    margin-right: auto;

    color: #758096;
}

.empty {
    background: white;

    border-radius: 20px;

    padding: 55px 20px;

    text-align: center;

    color: #9aa3b4;
}

.empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
}

/* =========================
   側邊欄
========================= */

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.side-card {
    background: rgba(255,255,255,0.95);

    border-radius: 19px;

    padding: 20px;

    border: 1px solid rgba(120,140,180,0.12);

    box-shadow:
        0 5px 20px rgba(60,80,130,0.04);
}

.side-title {
    font-size: 15px;
    font-weight: 800;

    color: #39445b;

    margin-bottom: 14px;
}

/* =========================
   發表按鈕
========================= */

.create-btn {
    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #789aff,
            #8979e7
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(100,120,220,0.2);

    transition: 0.2s;
}

.create-btn:hover {
    transform: translateY(-1px);
}

/* =========================
   快速入口
========================= */

.quick-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.quick-btn {
    border: none;

    background: #f5f7fb;

    color: #647087;

    padding: 13px 8px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 12px;

    transition: 0.2s;
}

.quick-btn:hover {
    background: #edf1fa;
    transform: translateY(-1px);
}

/* =========================
   社群資訊
========================= */

.info-row {
    display: flex;
    justify-content: space-between;

    padding: 9px 0;

    border-bottom: 1px solid #f0f2f6;

    font-size: 12px;
}

.info-row:last-child {
    border-bottom: none;
}

.info-label {
    color: #929bad;
}

.info-value {
    color: #566177;
    font-weight: 700;
}

/* =========================
   便利貼
========================= */

.note {
    background: #fff8cf;

    border-radius: 13px;

    padding: 13px;

    font-size: 12px;

    color: #77704d;

    margin-bottom: 9px;

    line-height: 1.6;
}

.note:last-child {
    margin-bottom: 0;
}

/* =========================
   管理員
========================= */

.admin-panel {
    display: none;

    background:
        linear-gradient(
            135deg,
            #303a58,
            #454d70
        );

    color: white;

    border-radius: 19px;

    padding: 20px;

    box-shadow:
        0 10px 25px rgba(40,50,90,0.2);
}

.admin-panel h3 {
    margin-bottom: 8px;
    font-size: 15px;
}

.admin-panel p {
    color: #cbd1e2;
    font-size: 12px;
    margin-bottom: 14px;
    line-height: 1.6;
}

.admin-btn {
    width: 100%;

    border: none;

    background: rgba(255,255,255,0.12);

    color: white;

    padding: 11px;

    border-radius: 11px;

    cursor: pointer;
}

/* =========================
   響應式
========================= */

@media (max-width: 850px) {

    .container {
        grid-template-columns: 1fr;
    }

    .sidebar {
        display: grid;

        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }

    .admin-panel {
        grid-column: 1 / -1;
    }
}

@media (max-width: 560px) {

    .navbar {
        padding: 0 4%;
    }

    .logo-text p {
        display: none;
    }

    .user-info {
        padding: 6px;
    }

    .user-info span:not(.avatar) {
        display: none;
    }

    .logout-btn {
        padding: 8px 10px;
        font-size: 11px;
    }

    .container {
        width: 94%;
        margin-top: 18px;
    }

    .welcome {
        padding: 24px;
        border-radius: 20px;
    }

    .welcome h2 {
        font-size: 21px;
    }

    .sidebar {
        display: flex;
    }
}
</style>
</head>


<body>

<!-- =========================
     導覽列
========================= -->

<header class="navbar">

    <div class="logo-area">

        <div class="logo">
            資
        </div>

        <div class="logo-text">

            <h1>資訊系談心閣</h1>

            <p>
                Information Department Community
            </p>

        </div>

    </div>


    <div class="user-area">

        <div class="user-info">

            <div class="avatar" id="avatar">
                S
            </div>

            <div>
                <span id="usernameText">
                    使用者
                </span>

                <div class="role" id="roleText">
                    一般使用者
                </div>
            </div>

        </div>

        <button
            class="logout-btn"
            onclick="logout()">

            登出

        </button>

    </div>

</header>



<!-- =========================
     主內容
========================= -->

<main class="container">

    <!-- 左邊 -->

    <section>

        <!-- 歡迎 -->

        <div class="welcome">

            <h2 id="welcomeTitle">
                歡迎來到資訊系談心閣
            </h2>

            <p>
                寫程式累了嗎？來這裡聊聊吧。
                分享課業、遊戲、程式或生活中的大小事。
            </p>

        </div>


        <!-- 分類 -->

        <div class="category-bar">

            <button
                class="category-btn active"
                onclick="filterPosts('全部', this)">

                全部

            </button>

            <button
                class="category-btn"
                onclick="filterPosts('程式', this)">

                💻 程式

            </button>

            <button
                class="category-btn"
                onclick="filterPosts('課業', this)">

                📚 課業

            </button>

            <button
                class="category-btn"
                onclick="filterPosts('遊戲', this)">

                🎮 遊戲

            </button>

            <button
                class="category-btn"
                onclick="filterPosts('閒聊', this)">

                💬 閒聊

            </button>

            <button
                class="category-btn"
                onclick="filterPosts('心情', this)">

                ❤️ 心情

            </button>

        </div>


        <!-- 排序 -->

        <div class="sort-bar">

            <button
                class="sort-btn active"
                onclick="sortPosts('latest', this)">

                最新

            </button>

            <button
                class="sort-btn"
                onclick="sortPosts('hot', this)">

                熱門

            </button>

        </div>


        <!-- 文章 -->

        <div
            class="post-list"
            id="postList">

        </div>

    </section>



    <!-- =========================
         右側
    ========================= -->

    <aside class="sidebar">


        <!-- 發表文章 -->

        <div class="side-card">

            <div class="side-title">
                分享你的想法
            </div>

            <button
                class="create-btn"
                onclick="goToPost()">

                ＋ 發表文章

            </button>

        </div>


        <!-- 快速入口 -->

        <div class="side-card">

            <div class="side-title">
                快速入口
            </div>

            <div class="quick-grid">

                <button
                    class="quick-btn"
                    onclick="goToQuestions()">

                    ❓<br>
                    匿名提問

                </button>


                <button
                    class="quick-btn"
                    onclick="goToNotes()">

                    📌<br>
                    便利貼

                </button>


                <button
                    class="quick-btn"
                    onclick="showReportInfo()">

                    🚩<br>
                    檢舉

                </button>


                <button
                    class="quick-btn"
                    onclick="scrollToPosts()">

                    🔥<br>
                    熱門文章

                </button>

            </div>

        </div>


        <!-- 社群資訊 -->

        <div class="side-card">

            <div class="side-title">
                談心閣資訊
            </div>

            <div class="info-row">

                <span class="info-label">
                    今日文章
                </span>

                <span
                    class="info-value"
                    id="todayCount">

                    0

                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    社群狀態
                </span>

                <span class="info-value">
                    ● 正常
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    登入身份
                </span>

                <span
                    class="info-value"
                    id="sideRole">

                    使用者

                </span>

            </div>

        </div>


        <!-- 便利貼 -->

        <div class="side-card">

            <div class="side-title">
                📌 今日便利貼
            </div>

            <div class="note">
                寫不出 Bug 不代表你不會寫程式，
                有時候只是少了一杯咖啡。
            </div>

            <div class="note">
                今天也辛苦了，記得適度休息。
            </div>

        </div>


        <!-- 管理員 -->

        <div
            class="admin-panel"
            id="adminPanel">

            <h3>
                🛡️ 管理控制中心
            </h3>

            <p>
                目前以管理員身份登入，
                可以進入後台管理文章與檢舉資料。
            </p>

            <button
                class="admin-btn"
                onclick="goToAdmin()">

                進入管理後台 →

            </button>

        </div>

    </aside>

</main>



<script>

/* ==================================================
   使用者資訊
================================================== */

const loginUser =
    sessionStorage.getItem("loginUser")
    || "student";

const userRole =
    sessionStorage.getItem("userRole")
    || "user";


/* ==================================================
   顯示使用者
================================================== */

document.getElementById("usernameText").textContent =
    loginUser;

document.getElementById("avatar").textContent =
    loginUser.charAt(0).toUpperCase();


if (userRole === "admin") {

    document.getElementById("roleText").textContent =
        "管理員";

    document.getElementById("sideRole").textContent =
        "管理員";

    document.getElementById("adminPanel").style.display =
        "block";

} else {

    document.getElementById("roleText").textContent =
        "一般使用者";

    document.getElementById("sideRole").textContent =
        "一般使用者";
}


/* ==================================================
   歡迎文字
================================================== */

document.getElementById("welcomeTitle").textContent =
    "歡迎回來，" + loginUser + " 👋";


/* ==================================================
   文章資料
================================================== */

const samplePosts = [

    {
        id: "sample1",
        title: "大家學 C++ 的時候最容易卡在哪裡？",
        content:
            "最近開始學 C++，目前正在學迴圈跟陣列，想知道大家剛開始學的時候最容易在哪個地方卡住。",
        category: "程式",
        author: "匿名使用者",
        likes: 24,
        comments: 8,
        createdAt: new Date(Date.now() - 3600000).toISOString()
    },

    {
        id: "sample2",
        title: "期中考快到了，有人也是完全不知道從哪裡開始嗎",
        content:
            "最近幾科一起考，突然不知道該先讀哪一科，有沒有資訊系的同學可以分享一下自己的讀書方法？",
        category: "課業",
        author: "匿名使用者",
        likes: 18,
        comments: 12,
        createdAt: new Date(Date.now() - 7200000).toISOString()
    },

    {
        id: "sample3",
        title: "最近終於把自己的小遊戲做出來了",
        content:
            "第一次自己從 HTML、CSS、JavaScript 一路做完一個可以玩的遊戲，雖然還有很多地方需要改，但真的滿有成就感。",
        category: "遊戲",
        author: "student",
        likes: 35,
        comments: 15,
        createdAt: new Date(Date.now() - 86400000).toISOString()
    },

    {
        id: "sample4",
        title: "資訊系是不是都很常熬夜",
        content:
            "不知道是不是只有我，每次寫程式寫著寫著就凌晨了，回過神才發現已經完全忘記時間。",
        category: "閒聊",
        author: "匿名使用者",
        likes: 42,
        comments: 21,
        createdAt: new Date(Date.now() - 172800000).toISOString()
    }

];


/* ==================================================
   目前狀態
================================================== */

let currentCategory = "全部";

let currentSort = "latest";


/* ==================================================
   取得使用者文章
================================================== */

function getUserPosts() {

    try {

        const data =
            localStorage.getItem("talkingHallPosts");

        if (!data) {
            return [];
        }

        const posts = JSON.parse(data);

        if (!Array.isArray(posts)) {
            return [];
        }

        return posts;

    } catch (error) {

        console.error(
            "讀取文章失敗:",
            error
        );

        return [];
    }
}


/* ==================================================
   所有文章
================================================== */

function getAllPosts() {

    const userPosts =
        getUserPosts();

    return [
        ...userPosts,
        ...samplePosts
    ];
}


/* ==================================================
   時間格式
================================================== */

function formatPostTime(dateString) {

    const time =
        new Date(dateString).getTime();

    const now =
        Date.now();

    const diff =
        now - time;

    const minute =
        60 * 1000;

    const hour =
        60 * minute;

    const day =
        24 * hour;


    if (diff < minute) {
        return "剛剛";
    }

    if (diff < hour) {
        return Math.floor(diff / minute) + " 分鐘前";
    }

    if (diff < day) {
        return Math.floor(diff / hour) + " 小時前";
    }

    if (diff < day * 7) {
        return Math.floor(diff / day) + " 天前";
    }

    const date =
        new Date(dateString);

    return (
        date.getFullYear()
        + "/"
        + String(date.getMonth() + 1).padStart(2, "0")
        + "/"
        + String(date.getDate()).padStart(2, "0")
    );
}


/* ==================================================
   渲染文章
================================================== */

function renderPosts() {

    const postList =
        document.getElementById("postList");

    postList.innerHTML = "";


    let posts =
        getAllPosts();


    /* 分類 */

    if (currentCategory !== "全部") {

        posts =
            posts.filter(function(post) {

                return post.category === currentCategory;

            });

    }


    /* 排序 */

    if (currentSort === "latest") {

        posts.sort(function(a, b) {

            return (
                new Date(b.createdAt)
                -
                new Date(a.createdAt)
            );

        });

    } else {

        posts.sort(function(a, b) {

            const hotA =
                (Number(a.likes) || 0)
                +
                (Number(a.comments) || 0) * 2;

            const hotB =
                (Number(b.likes) || 0)
                +
                (Number(b.comments) || 0) * 2;

            return hotB - hotA;

        });

    }


    /* 沒文章 */

    if (posts.length === 0) {

        postList.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📭</div>
                <div>目前沒有符合條件的文章</div>
            </div>
        `;

        return;
    }


    /* 建立文章 */

    posts.forEach(function(post) {

        const card =
            document.createElement("article");

        card.className =
            "post-card";


        /* 上方 */

        const top =
            document.createElement("div");

        top.className =
            "post-top";


        const category =
            document.createElement("span");

        category.className =
            "post-category";

        category.textContent =
            post.category || "閒聊";


        const time =
            document.createElement("span");

        time.className =
            "post-time";

        time.textContent =
            formatPostTime(
                post.createdAt
            );


        top.appendChild(category);
        top.appendChild(time);


        /* 標題 */

        const title =
            document.createElement("h3");

        title.className =
            "post-title";

        title.textContent =
            post.title || "未命名文章";


        /* 內容 */

        const preview =
            document.createElement("p");

        preview.className =
            "post-preview";

        preview.textContent =
            post.content || "";


        /* 底部 */

        const bottom =
            document.createElement("div");

        bottom.className =
            "post-bottom";


        const author =
            document.createElement("span");

        author.className =
            "post-author";

        author.textContent =
            "👤 " +
            (post.author || "匿名使用者");


        const likes =
            document.createElement("span");

        likes.textContent =
            "♡ " +
            (Number(post.likes) || 0);


        const comments =
            document.createElement("span");

        comments.textContent =
            "💬 " +
            (Number(post.comments) || 0);


        bottom.appendChild(author);
        bottom.appendChild(likes);
        bottom.appendChild(comments);


        card.appendChild(top);
        card.appendChild(title);
        card.appendChild(preview);
        card.appendChild(bottom);


        /* =========================================
           重要：文章點擊
        ========================================= */

        card.addEventListener(
            "click",
            function() {

                const postId =
                    String(post.id);

                window.location.href =
                    "./post-detail.html?id="
                    +
                    encodeURIComponent(postId);

            }
        );


        postList.appendChild(card);

    });

}


/* ==================================================
   分類
================================================== */

function filterPosts(
    category,
    button
) {

    currentCategory =
        category;


    document
        .querySelectorAll(".category-btn")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    renderPosts();

}


/* ==================================================
   排序
================================================== */

function sortPosts(
    type,
    button
) {

    currentSort =
        type;


    document
        .querySelectorAll(".sort-btn")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    renderPosts();

}


/* ==================================================
   今日文章數
================================================== */

function updateTodayCount() {

    const posts =
        getUserPosts();

    const today =
        new Date();

    const count =
        posts.filter(function(post) {

            const date =
                new Date(post.createdAt);

            return (
                date.getFullYear()
                ===
                today.getFullYear()

                &&

                date.getMonth()
                ===
                today.getMonth()

                &&

                date.getDate()
                ===
                today.getDate()
            );

        }).length;


    document.getElementById(
        "todayCount"
    ).textContent = count;

}

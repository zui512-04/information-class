
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101226">
<title>資訊系談心閣｜交流社群</title>

<style>
:root {
    color-scheme: dark;
    --bg: #0e1020;
    --panel: #191b31;
    --panel2: #242743;
    --purple: #8179ff;
    --text: #f2f3ff;
    --muted: #979cba;
    --border: rgba(255,255,255,.09);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
    margin: 0;
    background:
        radial-gradient(ellipse at 10% 0%, rgba(102,83,221,.17), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: "Microsoft JhengHei", sans-serif;
    font-size: 14px;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
button:focus-visible, input:focus-visible,
textarea:focus-visible, select:focus-visible {
    outline: 2px solid #a49cff;
    outline-offset: 2px;
}
.topbar {
    height: 72px;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14,16,32,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 1px;
}
.brand-icon {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(135deg,#6c7cff,#9867e9);
    font-size: 22px;
}
.top-right { display: flex; align-items: center; gap: 12px; }
.user-pill {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #d5d7ff;
}
.btn {
    padding: 10px 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    background: var(--panel2);
}
.btn-primary {
    border: 0;
    background: linear-gradient(120deg,#6979ff,#9368eb);
    color: white;
    font-weight: 700;
}
.btn:hover { filter: brightness(1.12); }

.layout {
    max-width: 1240px;
    margin: 34px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 225px minmax(0,1fr) 245px;
    gap: 24px;
    align-items: start;
}
.panel {
    background: rgba(25,27,49,.92);
    border: 1px solid var(--border);
    border-radius: 17px;
}
.sidebar {
    padding: 18px;
    position: sticky;
    top: 94px;
}
.side-title {
    margin: 2px 0 15px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.5px;
}
.nav-item {
    width: 100%;
    padding: 12px;
    margin-bottom: 5px;
    text-align: left;
    color: #b5bad4;
    border: 0;
    border-radius: 10px;
    background: transparent;
}
.nav-item:hover, .nav-item.active {
    color: white;
    background: rgba(126,117,255,.15);
}
.hero {
    padding: 26px;
    margin-bottom: 19px;
    overflow: hidden;
    position: relative;
    background:
        radial-gradient(ellipse at 100% 0%,rgba(159,112,255,.25),transparent 45%),
        linear-gradient(130deg,#24284c,#191b34);
}
.hero::after {
    content: "✦";
    position: absolute;
    right: 24px;
    top: 8px;
    font-size: 78px;
    color: rgba(194,184,255,.14);
    pointer-events: none;
}
.eyebrow {
    color: #b4b3ff;
    font-size: 11px;
    letter-spacing: 2px;
}
.hero h1 { margin: 12px 0 8px; font-size: 27px; }
.hero p {
    max-width: 440px;
    color: #b2b7d2;
    line-height: 1.9;
    margin: 0;
}
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}
.search {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel);
    color: white;
}
.composer {
    padding: 21px;
    margin-bottom: 18px;
}
.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}
.section-heading h2 { margin: 0; font-size: 17px; }
.field { margin-bottom: 14px; }
.field label {
    display: block;
    margin-bottom: 8px;
    color: #c9cce4;
    font-size: 12px;
}
.field input, .field textarea, .field select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #111327;
    color: white;
    outline: none;
}
.field textarea {
    min-height: 135px;
    resize: vertical;
    line-height: 1.8;
}
.field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--purple);
}
.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
}
.notice {
    display: none;
    padding: 12px 14px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: rgba(255,100,125,.1);
    border: 1px solid rgba(255,100,125,.2);
    color: #ffadbb;
    line-height: 1.7;
    overflow-wrap: anywhere;
}
.notice.show { display: block; }
.notice.success {
    background: rgba(75,210,150,.08);
    border-color: rgba(75,210,150,.2);
    color: #a5f0ca;
}
.post {
    padding: 22px;
    margin-bottom: 15px;
    transition: border-color .2s;
}
.post:hover { border-color: rgba(143,133,255,.3); }
.post-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    color: var(--muted);
    font-size: 11px;
}
.avatar {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 11px;
    background: linear-gradient(135deg,#627cff,#a16be9);
    color: white;
    font-size: 15px;
}
.category {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    background: rgba(129,121,255,.13);
    color: #b9b5ff;
}
.post h3 {
    margin: 16px 0 9px;
    font-size: 18px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}
.post-content {
    color: #b9bdd5;
    line-height: 1.95;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 19px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}
.action {
    padding: 8px 11px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: #a8aecb;
    font-size: 12px;
}
.action:hover { background: var(--panel2); color: white; }
.action.liked {
    color: #c2baff;
    background: rgba(129,121,255,.14);
}
.own-actions { margin-left: auto; display: flex; gap: 4px; }
.comments {
    margin-top: 17px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
}
.comment {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,.045);
}
.comment:last-child { border-bottom: 0; }
.comment-author { color: #c3bdff; font-size: 12px; }
.comment-content {
    margin-top: 6px;
    line-height: 1.8;
    color: #c5c9df;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}
.comment-form input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #111327;
    color: white;
}
.right-card { padding: 19px; margin-bottom: 16px; }
.right-card h3 { margin: 0 0 13px; font-size: 14px; }
.right-card p {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.9;
}
.stat {
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}
.stat:last-child { border-bottom: 0; }
.stat strong {
    display: block;
    font-size: 20px;
    color: #c1baff;
}
.stat span { color: var(--muted); font-size: 11px; }
.state {
    padding: 38px 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.9;
}
.footer {
    padding: 20px;
    color: #6d7392;
    font-size: 11px;
    text-align: center;
}
@media (max-width: 1000px) {
    .layout { grid-template-columns: 200px minmax(0,1fr); }
    .right-column { display: none; }
}
@media (max-width: 680px) {
    .topbar { height: 62px; padding: 0 15px; }
    .brand { font-size: 15px; gap: 8px; }
    .brand-icon { width: 35px; height: 35px; }
    .user-pill { display: none; }
    .top-right { gap: 6px; }
    .top-right .btn { padding: 9px 10px; font-size: 12px; }
    .layout { display: block; margin: 20px auto; padding: 0 13px; }
    .sidebar { position: static; padding: 10px; margin-bottom: 15px; }
    .sidebar .side-title { display: none; }
    .nav-list { display: flex; gap: 5px; overflow-x: auto; }
    .nav-item { width: auto; flex-shrink: 0; margin: 0; padding: 10px 13px; }
    .hero { padding: 21px; }
    .hero h1 { font-size: 23px; }
    .toolbar { flex-wrap: wrap; }
    .toolbar .btn { flex-shrink: 0; }
    .post { padding: 17px; }
    .post h3 { font-size: 16px; }
    .composer { padding: 17px; }
}
</style>
</head>

<body>
<header class="topbar">
    <div class="brand">
        <div class="brand-icon">💻</div>
        <span>資訊系談心閣</span>
    </div>
    <div class="top-right">
        <span class="user-pill" id="userName">正在確認登入…</span>
        <button class="btn" id="logoutButton" type="button">登出</button>
    </div>
</header>

<div class="layout">
    <aside class="panel sidebar">
        <div class="side-title">COMMUNITY</div>
        <nav class="nav-list" id="categoryNav">
            <button class="nav-item active" data-category="全部" type="button">✦ 全部文章</button>
            <button class="nav-item" data-category="課業交流" type="button">📚 課業交流</button>
            <button class="nav-item" data-category="程式技術" type="button">⌨ 程式技術</button>
            <button class="nav-item" data-category="校園生活" type="button">☕ 校園生活</button>
            <button class="nav-item" data-category="心情分享" type="button">🌙 心情分享</button>
            <button class="nav-item" data-category="問題求助" type="button">💬 問題求助</button>
            <button class="nav-item" data-category="其他" type="button">✧ 其他</button>
        </nav>
    </aside>

    <main>
        <section class="panel hero">
            <div class="eyebrow">WELCOME TO YOUR COMMUNITY</div>
            <h1>在這裡，放心聊聊。✦</h1>
            <p>不論是課業、程式、校園日常，還是那些不知道該向誰說的想法，都可以在談心閣找到交流的空間。</p>
        </section>

        <div id="notice" class="notice" role="status" aria-live="polite"></div>

        <section class="toolbar">
            <input id="searchInput" class="search" type="search"
                placeholder="搜尋文章標題、內容或作者…" maxlength="100"
                aria-label="搜尋文章">
            <button class="btn btn-primary" id="newPostButton" type="button">＋ 發布文章</button>
        </section>

        <section class="panel composer" id="composer" hidden>
            <div class="section-heading">
                <h2 id="composerTitle">寫下你的想法</h2>
                <span class="category">文章編輯</span>
            </div>
            <form id="postForm">
                <div class="field">
                    <label for="postTitle">文章標題</label>
                    <input id="postTitle" maxlength="100" required
                        placeholder="替你的文章取個標題吧">
                </div>
                <div class="field">
                    <label for="postCategory">文章分類</label>
                    <select id="postCategory" required>
                        <option value="課業交流">課業交流</option>
                        <option value="程式技術">程式技術</option>
                        <option value="校園生活">校園生活</option>
                        <option value="心情分享">心情分享</option>
                        <option value="問題求助">問題求助</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="field">
                    <label for="postContent">文章內容</label>
                    <textarea id="postContent" maxlength="10000" required
                        placeholder="分享你的問題、經驗或最近的心情……"></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn" id="cancelPostButton" type="button">取消</button>
                    <button class="btn btn-primary" id="submitPostButton" type="submit">發布文章</button>
                </div>
            </form>
        </section>

        <div class="section-heading">
            <h2 id="listTitle">最新文章</h2>
            <span id="postCount" style="color:var(--muted);font-size:12px">載入中…</span>
        </div>

        <section id="postsList" aria-live="polite">
            <div class="panel state">正在載入文章…</div>
        </section>
    </main>

    <aside class="right-column">
        <section class="panel right-card">
            <h3>✦ 談心閣小提醒</h3>
            <p>尊重每一種不同的想法，分享知識與經驗，也請勿公開自己的密碼、電話或其他私人資訊。</p>
        </section>
        <section class="panel right-card">
            <h3>✧ 社群功能</h3>
            <div class="stat">
                <strong id="visibleCount">—</strong>
                <span>目前顯示的文章</span>
            </div>
            <div class="stat">
                <strong>6</strong>
                <span>文章分類</span>
            </div>
        </section>
        <section class="panel right-card">
            <h3>🌙 一句話</h3>
            <p>每個問題都值得被認真對待，每個想法也都可以有自己的位置。</p>
        </section>
    </aside>
</div>

<footer class="footer">資訊系談心閣 · 讓想法有地方安放</footer>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    orderBy,
    limit,
    onSnapshot,
    addDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    getDocs,
    getCountFromServer,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC4JcXSSVmQTrEtC4lXoWeDz2lLr3eVGtw",
    authDomain: "information-4d4f4.firebaseapp.com",
    projectId: "information-4d4f4",
    storageBucket: "information-4d4f4.firebasestorage.app",
    messagingSenderId: "311907004696",
    appId: "1:311907004696:web:fe43a91660989ccb282e6d",
    measurementId: "G-SREHE03KC4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let currentUser = null;
let currentProfile = null;
let allPosts = [];
let selectedCategory = "全部";
let editingPostId = null;
let stopPostsListener = null;
let actionBusy = false;
const expandedComments = new Set();

function showNotice(message, success = false) {
    $("notice").textContent = message;
    $("notice").classList.add("show");
    $("notice").classList.toggle("success", success);
    $("notice").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function hideNotice() {
    $("notice").textContent = "";
    $("notice").classList.remove("show", "success");
}

function escapeHTML(value = "") {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function friendlyError(error) {
    console.error(error);

    const messages = {
        "permission-denied": "資料庫拒絕這次操作。請確認 Firestore Rules 已正確發布。",
        "unavailable": "Firebase 暫時無法連線，請稍後再試。",
        "unauthenticated": "登入狀態已失效，請重新登入。",
        "failed-precondition": "資料庫缺少必要索引，請查看瀏覽器錯誤訊息。",
        "not-found": "找不到指定的資料，可能已被刪除。"
    };

    return messages[error.code] ||
        `操作失敗（${error.code || error.message || "未知錯誤"}），請稍後再試。`;
}

function formatDate(timestamp) {
    if (!timestamp || typeof timestamp.toDate !== "function") {
        return "剛剛";
    }

    return timestamp.toDate().toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function openComposer(post = null) {
    editingPostId = post ? post.id : null;
    $("composer").hidden = false;
    $("composerTitle").textContent = post ? "編輯文章" : "寫下你的想法";
    $("postTitle").value = post ? post.title : "";
    $("postContent").value = post ? post.content : "";
    $("postCategory").value = post ? post.category : "課業交流";
    $("submitPostButton").textContent = post ? "儲存修改" : "發布文章";
    $("composer").scrollIntoView({ behavior: "smooth", block: "start" });
    $("postTitle").focus();
}

function closeComposer() {
    $("composer").hidden = true;
    editingPostId = null;
    $("postForm").reset();
    $("submitPostButton").textContent = "發布文章";
    $("composerTitle").textContent = "寫下你的想法";
}

$("newPostButton").addEventListener("click", () => {
    hideNotice();
    openComposer();
});

$("cancelPostButton").addEventListener("click", closeComposer);

$("logoutButton").addEventListener("click", async () => {
    try {
        await signOut(auth);
        sessionStorage.removeItem("loginUser");
        localStorage.removeItem("loginUser");
        sessionStorage.removeItem("userRole");
        localStorage.removeItem("userRole");
        window.location.replace("../index.html");
    } catch (error) {
        showNotice(friendlyError(error));
    }
});

$("categoryNav").addEventListener("click", event => {
    const button = event.target.closest("[data-category]");
    if (!button) return;

    selectedCategory = button.dataset.category;

    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.toggle("active", item === button);
    });

    $("listTitle").textContent =
        selectedCategory === "全部" ? "最新文章" : selectedCategory;

    renderPosts();
});

$("searchInput").addEventListener("input", renderPosts);

$("postForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!currentUser || !currentProfile || actionBusy) return;

    hideNotice();

    const title = $("postTitle").value.trim();
    const content = $("postContent").value.trim();
    const category = $("postCategory").value;
    const allowedCategories = [
        "課業交流", "程式技術", "校園生活",
        "心情分享", "問題求助", "其他"
    ];

    if (!title || !content) {
        showNotice("請填寫文章標題和內容。");
        return;
    }

    if (title.length > 100 || content.length > 10000) {
        showNotice("文章標題或內容超過允許長度。");
        return;
    }

    if (!allowedCategories.includes(category)) {
        showNotice("請選擇有效的文章分類。");
        return;
    }

    actionBusy = true;
    $("submitPostButton").disabled = true;

    try {
        if (editingPostId) {
            const post = allPosts.find(item => item.id === editingPostId);

            if (!post || post.authorUid !== currentUser.uid) {
                throw new Error("你只能修改自己的文章。");
            }

            await updateDoc(doc(db, "posts", editingPostId), {
                title,
                content,
                category,
                updatedAt: serverTimestamp()
            });

            showNotice("文章已更新。", true);
        } else {
            await addDoc(collection(db, "posts"), {
                title,
                content,
                category,
                authorUid: currentUser.uid,
                authorName: currentProfile.username,
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });

            showNotice("文章發布成功！", true);
        }

        closeComposer();
    } catch (error) {
        showNotice(error.message && !error.code
            ? error.message
            : friendlyError(error));
    } finally {
        actionBusy = false;
        $("submitPostButton").disabled = false;
    }
});

function renderPosts() {
    const keyword = $("searchInput").value.trim().toLowerCase();

    const posts = allPosts.filter(post => {
        const matchesCategory =
            selectedCategory === "全部" || post.category === selectedCategory;

        const matchesKeyword = !keyword ||
            [post.title, post.content, post.authorName, post.category]
                .some(value => String(value || "").toLowerCase().includes(keyword));

        return matchesCategory && matchesKeyword;
    });

    $("postCount").textContent = `${posts.length} 篇文章`;
    $("visibleCount").textContent = posts.length;
    $("postsList").replaceChildren();

    if (posts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "panel state";
        empty.textContent = allPosts.length === 0
            ? "這裡還沒有文章，成為第一個分享想法的人吧！"
            : "找不到符合條件的文章，試試其他關鍵字或分類。";
        $("postsList").append(empty);
        return;
    }

    for (const post of posts) {
        const isOwner = currentUser && post.authorUid === currentUser.uid;
        const article = document.createElement("article");
        article.className = "panel post";
        article.dataset.postId = post.id;

        article.innerHTML = `
            <div class="post-meta">
                <div class="avatar">${escapeHTML((post.authorName || "?").slice(0,1).toUpperCase())}</div>
                <span>${escapeHTML(post.authorName || "匿名使用者")}</span>
                <span>·</span>
                <span>${escapeHTML(formatDate(post.createdAt))}</span>
                <span class="category">${escapeHTML(post.category || "其他")}</span>
            </div>
            <h3>${escapeHTML(post.title)}</h3>
            <div class="post-content">${escapeHTML(post.content)}</div>
            <div class="post-actions">
                <button class="action" data-action="like" type="button">♡ 按讚</button>
                <button class="action" data-action="comments" type="button">💬 留言</button>
                ${isOwner ? `
                    <div class="own-actions">
                        <button class="action" data-action="edit" type="button">編輯</button>
                        <button class="action" data-action="delete" type="button">刪除</button>
                    </div>` : ""}
            </div>
            <div class="comments" ${expandedComments.has(post.id) ? "" : "hidden"}>
                <div class="comment-list">載入留言中…</div>
                <form class="comment-form">
                    <input name="comment" maxlength="2000" required
                        placeholder="留下友善的留言…" aria-label="留言內容">
                    <button class="btn btn-primary" type="submit">送出</button>
                </form>
            </div>
        `;

        $("postsList").append(article);

        refreshLikeState(post.id, article).catch(error => {
            console.error("讀取按讚狀態失敗：", error);
        });

        if (expandedComments.has(post.id)) {
            loadComments(post.id, article).catch(error => {
                const list = article.querySelector(".comment-list");
                if (list) list.textContent = friendlyError(error);
            });
        }
    }
}

async function refreshLikeState(postId, article) {
    if (!article.isConnected || !currentUser) return;

    const likesRef = collection(db, "posts", postId, "likes");
    const myLikeRef = doc(db, "posts", postId, "likes", currentUser.uid);

    const [countSnapshot, myLike] = await Promise.all([
        getCountFromServer(likesRef),
        getDoc(myLikeRef)
    ]);

    if (!article.isConnected) return;

    const button = article.querySelector('[data-action="like"]');
    if (!button) return;

    const liked = myLike.exists();
    button.textContent = `${liked ? "♥" : "♡"} 按讚 ${countSnapshot.data().count}`;
    button.classList.toggle("liked", liked);
}

async function loadComments(postId, article) {
    const list = article.querySelector(".comment-list");
    if (!list) return;

    const commentsQuery = query(
        collection(db, "posts", postId, "comments"),
        orderBy("createdAt", "asc"),
        limit(100)
    );

    const snapshot = await getDocs(commentsQuery);

    if (!article.isConnected) return;

    list.replaceChildren();

    if (snapshot.empty) {
        const empty = document.createElement("div");
        empty.className = "state";
        empty.textContent = "還沒有留言，來留下第一句話吧。";
        list.append(empty);
        return;
    }

    snapshot.forEach(commentDoc => {
        const data = commentDoc.data();
        const item = document.createElement("div");
        item.className = "comment";

        const author = document.createElement("div");
        author.className = "comment-author";
        author.textContent =
            `${data.authorName || "匿名使用者"} · ${formatDate(data.createdAt)}`;

        const content = document.createElement("div");
        content.className = "comment-content";
        content.textContent = data.content || "";

        item.append(author, content);

        if (data.authorUid === currentUser.uid) {
            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "action";
            removeButton.textContent = "刪除留言";

            removeButton.addEventListener("click", async () => {
                if (!confirm("確定要刪除這則留言嗎？")) return;

                try {
                    await deleteDoc(doc(
                        db, "posts", postId, "comments", commentDoc.id
                    ));
                    await loadComments(postId, article);
                    showNotice("留言已刪除。", true);
                } catch (error) {
                    showNotice(friendlyError(error));
                }
            });

            item.append(removeButton);
        }

        list.append(item);
    });
}

$("postsList").addEventListener("click", async event => {
    const button = event.target.closest("[data-action]");
    if (!button || actionBusy) return;

    const article = button.closest("[data-post-id]");
    if (!article) return;

    const postId = article.dataset.postId;
    const post = allPosts.find(item => item.id === postId);
    if (!post) return;

    const action = button.dataset.action;
    hideNotice();

    if (action === "comments") {
        if (expandedComments.has(postId)) {
            expandedComments.delete(postId);
            article.querySelector(".comments").hidden = true;
        } else {
            expandedComments.add(postId);
            article.querySelector(".comments").hidden = false;

            try {
                await loadComments(postId, article);
            } catch (error) {
                showNotice(friendlyError(error));
            }
        }
        return;
    }

    if (action === "like") {
        actionBusy = true;
        button.disabled = true;

        try {
            const likeRef = doc(
                db, "posts", postId, "likes", currentUser.uid
            );
            const existing = await getDoc(likeRef);

            if (existing.exists()) {
                await deleteDoc(likeRef);
            } else {
                await setDoc(likeRef, {
                    uid: currentUser.uid,
                    createdAt: serverTimestamp()
                });
            }
        } catch (error) {
            showNotice(friendlyError(error));
        } finally {
            actionBusy = false;
            button.disabled = false;

            try {
                await refreshLikeState(postId, article);
            } catch (error) {
                console.error(error);
            }
        }
        return;
    }

    if (action === "edit") {
        if (post.authorUid !== currentUser.uid) {
            showNotice("你只能編輯自己的文章。");
            return;
        }

        openComposer(post);
        return;
    }

    if (action === "delete") {
        if (post.authorUid !== currentUser.uid) {
            showNotice("你只能刪除自己的文章。");
            return;
        }

        if (!confirm("確定要刪除這篇文章嗎？此操作無法復原。")) {
            return;
        }

        actionBusy = true;
        button.disabled = true;

        try {
            await deleteDoc(doc(db, "posts", postId));
            expandedComments.delete(postId);
            showNotice("文章已刪除。", true);
        } catch (error) {
            showNotice(friendlyError(error));
        } finally {
            actionBusy = false;
            button.disabled = false;
        }
    }
});

$("postsList").addEventListener("submit", async event => {
    const form = event.target.closest(".comment-form");
    if (!form) return;

    event.preventDefault();

    if (actionBusy || !currentUser || !currentProfile) return;

    const article = form.closest("[data-post-id]");
    const postId = article.dataset.postId;
    const input = form.elements.comment;
    const content = input.value.trim();

    if (!content) return;

    if (content.length > 2000) {
        showNotice("留言不能超過 2000 個字元。");
        return;
    }

    actionBusy = true;
    const submit = form.querySelector("button");
    submit.disabled = true;

    try {
        await addDoc(collection(db, "posts", postId, "comments"), {
            content,
            authorUid: currentUser.uid,
            authorName: currentProfile.username,
            createdAt: serverTimestamp()
        });

        input.value = "";
        await loadComments(postId, article);
        showNotice("留言已送出。", true);
    } catch (error) {
        showNotice(friendlyError(error));
    } finally {
        actionBusy = false;
        submit.disabled = false;
    }
});

onAuthStateChanged(auth, async user => {
    if (!user) {
        window.location.replace("../index.html");
        return;
    }

    if (!user.emailVerified) {
        await signOut(auth);
        window.location.replace("../index.html");
        return;
    }

    currentUser = user;

    try {
        const profileSnapshot = await getDoc(doc(db, "users", user.uid));

        if (!profileSnapshot.exists()) {
            showNotice("找不到你的個人資料，請重新登入或聯絡網站管理員。");
            return;
        }

        currentProfile = profileSnapshot.data();
        $("userName").textContent = currentProfile.username || "使用者";
        $("userName").title = currentProfile.username || "";

        if (stopPostsListener) stopPostsListener();

        const postsQuery = query(
            collection(db, "posts"),
            orderBy("createdAt", "desc"),
            limit(50)
        );

        stopPostsListener = onSnapshot(postsQuery, snapshot => {
            allPosts = snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));
            renderPosts();
        }, error => {
            showNotice(friendlyError(error));
            $("postsList").replaceChildren();

            const errorState = document.createElement("div");
            errorState.className = "panel state";
            errorState.textContent =
                "文章載入失敗。請確認 Firestore Rules 是否已設定文章讀取權限。";
            $("postsList").append(errorState);
        });
    } catch (error) {
        showNotice(friendlyError(error));
    }
});
</script>

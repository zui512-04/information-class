
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101226">
    <meta name="description" content="資訊系談心閣，屬於資訊人的交流空間。">
    <title>資訊系談心閣｜登入</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #101226;
            --panel: rgba(24, 27, 54, .88);
            --purple: #7775ff;
            --purple-light: #a49cff;
            --text: #f4f5ff;
            --muted: #9299ba;
            --border: rgba(255, 255, 255, .09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 18px;
            overflow-x: hidden;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, rgba(92, 82, 211, .23), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(99, 64, 181, .2), transparent 38%),
                linear-gradient(135deg, #0b0d1b, #15162e 52%, #101126);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .22;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            top: -120px;
            left: -90px;
            background: #6d65ff;
        }

        body::after {
            right: -100px;
            bottom: -130px;
            background: #a25bff;
        }

        button, input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .brand {
            text-align: center;
            margin-bottom: 27px;
        }

        .brand-icon {
            width: 74px;
            height: 74px;
            display: grid;
            place-items: center;
            margin: 0 auto 17px;
            border: 1px solid rgba(174, 170, 255, .32);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(120, 115, 255, .3), rgba(82, 72, 160, .12));
            box-shadow: 0 12px 40px rgba(90, 79, 230, .17);
            font-size: 35px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(25px, 6vw, 30px);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand p {
            margin: 10px 0 0;
            color: #a3a8c7;
            font-size: 13px;
            letter-spacing: 1.2px;
        }

        .card {
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--panel);
            box-shadow: 0 25px 80px rgba(0, 0, 0, .3);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .card-heading {
            margin-bottom: 23px;
        }

        .card-heading h2 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 750;
        }

        .card-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .mode-switch {
            display: flex;
            gap: 7px;
            padding: 5px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, .05);
            border-radius: 14px;
            background: rgba(9, 11, 27, .62);
        }

        .mode-button {
            flex: 1;
            min-height: 43px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: #9299ba;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .mode-button.active {
            color: white;
            background: linear-gradient(135deg, #6979ff, #8465e8);
            box-shadow: 0 5px 16px rgba(105, 113, 255, .2);
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group[hidden],
        .hidden {
            display: none !important;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e0e3fa;
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            display: block;
            width: 100%;
            height: 49px;
            padding: 0 14px;
            border: 1px solid rgba(183, 187, 230, .13);
            border-radius: 12px;
            outline: none;
            background: rgba(8, 10, 25, .5);
            color: white;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s;
        }

        input::placeholder {
            color: #69708e;
        }

        input:focus {
            border-color: #8580ff;
            box-shadow: 0 0 0 3px rgba(119, 117, 255, .13);
        }

        .password-input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #aab0d0;
            font-size: 17px;
            cursor: pointer;
        }

        .password-toggle:hover {
            background: rgba(255, 255, 255, .07);
            color: white;
        }

        .field-hint {
            margin: 7px 0 0;
            color: #7f87a8;
            font-size: 11px;
            line-height: 1.6;
        }

        .error-message {
            display: none;
            margin: 0 0 17px;
            padding: 12px 13px;
            border: 1px solid rgba(255, 107, 135, .2);
            border-radius: 11px;
            background: rgba(255, 80, 110, .08);
            color: #ff9bad;
            font-size: 12px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .error-message.show {
            display: block;
        }

        .error-message.success {
            border-color: rgba(90, 220, 160, .23);
            background: rgba(50, 200, 130, .09);
            color: #a0edc3;
        }

        .login-button {
            width: 100%;
            min-height: 50px;
            margin-top: 3px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(110deg, #6979ff, #9167ed);
            color: white;
            font-size: 15px;
            font-weight: 750;
            letter-spacing: .5px;
            cursor: pointer;
            box-shadow: 0 9px 24px rgba(99, 91, 235, .2);
            transition: transform .2s, filter .2s;
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .secondary-action {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 2px;
            border: 0;
            background: transparent;
            color: #a7a5ff;
            font-size: 12px;
            cursor: pointer;
        }

        .secondary-action:hover {
            color: white;
        }

        .security-info {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 23px;
            padding: 13px;
            border: 1px solid rgba(125, 145, 255, .1);
            border-radius: 12px;
            background: rgba(101, 117, 255, .055);
            color: #9099bc;
            font-size: 11px;
            line-height: 1.8;
        }

        .security-icon {
            flex-shrink: 0;
            font-size: 15px;
        }

        .footer {
            margin-top: 24px;
            color: #6f7695;
            font-size: 11px;
            text-align: center;
            line-height: 1.8;
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 15px;
            }

            .card {
                padding: 24px 20px;
                border-radius: 21px;
            }

            .brand-icon {
                width: 65px;
                height: 65px;
                border-radius: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="brand">
            <div class="brand-icon" aria-hidden="true">💻</div>
            <h1>資訊系談心閣</h1>
            <p>寫下想法，分享日常，找到同路人</p>
        </header>

        <section class="card">
            <div class="card-heading">
                <h2 id="headingTitle">歡迎回來</h2>
                <p id="headingDescription">登入帳號，回到屬於資訊人的交流空間。</p>
            </div>

            <div class="mode-switch" role="group" aria-label="選擇登入或註冊">
                <button type="button" class="mode-button active" id="loginModeButton">
                    登入
                </button>
                <button type="button" class="mode-button" id="registerModeButton">
                    註冊帳號
                </button>
            </div>

            <form id="authForm">
                <div class="form-group" id="usernameGroup" hidden>
                    <label for="username">自訂帳號</label>
                    <div class="input-wrapper">
                        <input
                            id="username"
                            type="text"
                            autocomplete="username"
                            minlength="3"
                            maxlength="20"
                            pattern="[a-zA-Z0-9_]{3,20}"
                            placeholder="例如：student_01"
                        >
                    </div>
                    <p class="field-hint">3～20 個字元，只能使用英文、數字及底線；這會是你的公開名稱。</p>
                </div>

                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <div class="input-wrapper">
                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            maxlength="254"
                            placeholder="請輸入電子郵件"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">密碼</label>
                    <div class="input-wrapper">
                        <input
                            class="password-input"
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            minlength="8"
                            maxlength="128"
                            placeholder="至少 8 個字元"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="顯示密碼"
                            aria-pressed="false"
                            title="顯示或隱藏密碼"
                        >👁</button>
                    </div>
                </div>

                <div class="form-group" id="confirmPasswordGroup" hidden>
                    <label for="confirmPassword">確認密碼</label>
                    <div class="input-wrapper">
                        <input
                            class="password-input"
                            id="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            maxlength="128"
                            placeholder="請再次輸入密碼"
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                            aria-label="顯示確認密碼"
                            aria-pressed="false"
                            title="顯示或隱藏確認密碼"
                        >👁</button>
                    </div>
                </div>

                <div
                    id="errorMessage"
                    class="error-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <button type="submit" class="login-button" id="loginButton">
                    登入談心閣
                </button>

                <button type="button" class="secondary-action" id="forgotPasswordButton">
                    忘記密碼？寄送重設信件
                </button>

                <button type="button" class="secondary-action hidden" id="resendVerificationButton">
                    重新寄送驗證信
                </button>
            </form>

            <div class="security-info">
                <span class="security-icon">🔐</span>
                <span>帳號使用 Firebase 驗證。請勿與他人分享密碼；註冊後需先完成電子郵件驗證，才能登入。</span>
            </div>
        </section>

        <footer class="footer">
            © 資訊系談心閣<br>
            讓每個想法，都有一個可以交流的地方。
        </footer>
    </main>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendEmailVerification,
            sendPasswordResetEmail,
            signOut,
            deleteUser
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            writeBatch,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4JcXSSVmQTrEtC4lXoWeDz2lLr3eVGtw",
            authDomain: "information-4d4f4.firebaseapp.com",
            projectId: "information-4d4f4",
            storageBucket: "information-4d4f4.firebasestorage.app",
            messagingSenderId: "311907004696",
            appId: "1:311907004696:web:fe43a91660989ccb282e6d",
            measurementId: "G-SREHE03KC4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authForm = document.getElementById("authForm");
        const loginModeButton = document.getElementById("loginModeButton");
        const registerModeButton = document.getElementById("registerModeButton");
        const usernameGroup = document.getElementById("usernameGroup");
        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordGroup = document.getElementById("confirmPasswordGroup");
        const confirmPasswordInput = document.getElementById("confirmPassword");
        const passwordToggle = document.getElementById("passwordToggle");
        const confirmPasswordToggle = document.getElementById("confirmPasswordToggle");
        const loginButton = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");
        const forgotPasswordButton = document.getElementById("forgotPasswordButton");
        const resendVerificationButton = document.getElementById("resendVerificationButton");
        const headingTitle = document.getElementById("headingTitle");
        const headingDescription = document.getElementById("headingDescription");

        let currentMode = "login";
        let busy = false;

        function showMessage(message, type = "error") {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
            errorMessage.classList.toggle("success", type === "success");
        }

        function hideMessage() {
            errorMessage.textContent = "";
            errorMessage.classList.remove("show", "success");
        }

        function switchMode(mode) {
            currentMode = mode;
            const isRegister = mode === "register";

            hideMessage();

            usernameGroup.hidden = !isRegister;
            confirmPasswordGroup.hidden = !isRegister;
            usernameInput.required = isRegister;
            confirmPasswordInput.required = isRegister;

            loginModeButton.classList.toggle("active", !isRegister);
            registerModeButton.classList.toggle("active", isRegister);

            headingTitle.textContent = isRegister ? "建立你的帳號" : "歡迎回來";
            headingDescription.textContent = isRegister
                ? "建立專屬帳號，加入資訊人的交流空間。"
                : "登入帳號，回到屬於資訊人的交流空間。";

            loginButton.textContent = isRegister ? "建立我的帳號" : "登入談心閣";
            passwordInput.autocomplete = isRegister ? "new-password" : "current-password";

            forgotPasswordButton.classList.toggle("hidden", isRegister);
            resendVerificationButton.classList.add("hidden");
        }

        loginModeButton.addEventListener("click", () => switchMode("login"));
        registerModeButton.addEventListener("click", () => switchMode("register"));

        function attachPasswordToggle(input, button) {
            button.addEventListener("click", () => {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                button.textContent = show ? "🙈" : "👁";
                button.setAttribute("aria-pressed", String(show));
                button.setAttribute("aria-label", show ? "隱藏密碼" : "顯示密碼");
            });
        }

        attachPasswordToggle(passwordInput, passwordToggle);
        attachPasswordToggle(confirmPasswordInput, confirmPasswordToggle);

        function readableError(error) {
            console.error("Firebase 操作錯誤：", error);

            const messages = {
                "auth/email-already-in-use": "這個電子郵件已經註冊，請切換到登入。",
                "auth/invalid-email": "電子郵件格式不正確。",
                "auth/weak-password": "密碼強度不足，請設定至少 8 個字元的密碼。",
                "auth/invalid-credential": "電子郵件或密碼錯誤，請重新確認。",
                "auth/user-disabled": "此帳號目前無法登入。",
                "auth/too-many-requests": "操作次數過多，請稍後再試。",
                "auth/network-request-failed": "網路連線失敗，請確認網路後再試。",
                "auth/operation-not-allowed": "Firebase 尚未啟用電子郵件／密碼登入。",
                "auth/invalid-action-code": "驗證連結已失效或已使用，請重新取得驗證信。",
                "permission-denied": "資料庫拒絕這次操作，請確認 Firestore Rules。",
                "unavailable": "資料庫目前無法連線，請稍後再試。"
            };

            return messages[error.code] ||
                "操作失敗（" + (error.code || "未知錯誤") + "）。請確認 Firebase 設定後再試。";
        }

        function setLoading(isLoading) {
            busy = isLoading;
            loginButton.disabled = isLoading;
            loginModeButton.disabled = isLoading;
            registerModeButton.disabled = isLoading;

            if (isLoading) {
                loginButton.textContent = "處理中…";
            } else {
                loginButton.textContent = currentMode === "register"
                    ? "建立我的帳號"
                    : "登入談心閣";
            }
        }

        async function registerAccount() {
            const username = usernameInput.value.trim().toLowerCase();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!/^[a-z0-9_]{3,20}$/.test(username)) {
                showMessage("自訂帳號需為 3～20 個字元，只能使用英文、數字和底線。");
                usernameInput.focus();
                return;
            }

            if (password.length < 8) {
                showMessage("密碼至少需要 8 個字元。");
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showMessage("兩次輸入的密碼不一致。");
                confirmPasswordInput.focus();
                return;
            }

            let createdUser = null;
            let profileCreated = false;

            try {
                const usernameRef = doc(db, "usernames", username);
                const usernameSnapshot = await getDoc(usernameRef);

                if (usernameSnapshot.exists()) {
                    showMessage("這個自訂帳號已被使用，請換一個。");
                    usernameInput.focus();
                    return;
                }

                const credential = await createUserWithEmailAndPassword(
                    auth, email, password
                );

                createdUser = credential.user;

                const batch = writeBatch(db);

                batch.set(usernameRef, {
                    uid: createdUser.uid
                });

                batch.set(doc(db, "users", createdUser.uid), {
                    username: username,
                    createdAt: serverTimestamp()
                });

                await batch.commit();
                profileCreated = true;

                try {
                    await sendEmailVerification(createdUser);
                } catch (emailError) {
                    console.error("驗證信寄送失敗：", emailError);
                    showMessage(
                        "帳號已建立，但驗證信暫時寄送失敗。請稍後登入並重新寄送驗證信。"
                    );
                    await signOut(auth);
                    return;
                }

                await signOut(auth);

                passwordInput.value = "";
                confirmPasswordInput.value = "";
                switchMode("login");
                emailInput.value = email;

                showMessage(
                    "註冊成功！驗證信已寄出，請先到電子郵件完成驗證，再登入談心閣。",
                    "success"
                );
            } catch (error) {
                console.error("註冊失敗：", error);

                if (createdUser && !profileCreated) {
                    try {
                        await deleteUser(createdUser);
                    } catch (cleanupError) {
                        console.error("清理未完成的帳號失敗：", cleanupError);
                    }
                    try {
                        await signOut(auth);
                    } catch (_) {}
                }

                if (error.code === "permission-denied") {
                    showMessage("Firestore 拒絕建立資料。請確認已發布正確的資料庫 Rules。");
                } else {
                    showMessage(readableError(error));
                }
            }
        }

        async function loginAccount() {
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("請輸入電子郵件和密碼。");
                return;
            }

            try {
                const credential = await signInWithEmailAndPassword(
                    auth, email, password
                );

                const user = credential.user;

                if (!user.emailVerified) {
                    await signOut(auth);
                    showMessage("電子郵件尚未驗證。請先查看信箱中的驗證信；如果沒有收到，可以重新寄送。");
                    resendVerificationButton.classList.remove("hidden");
                    return;
                }

                const profileSnapshot = await getDoc(doc(db, "users", user.uid));

                if (!profileSnapshot.exists()) {
                    await signOut(auth);
                    showMessage("找不到你的個人資料，請聯絡網站管理員。");
                    return;
                }

                const profile = profileSnapshot.data();

                // 只供舊頁面顯示使用，不可拿它當成安全驗證。
                sessionStorage.setItem("loginUser", profile.username);
                localStorage.setItem("loginUser", profile.username);

                // 不從瀏覽器儲存的角色判定管理員身分。
                sessionStorage.removeItem("userRole");
                localStorage.removeItem("userRole");

                loginButton.textContent = "登入成功，正在進入…";
                window.location.href = "pages/home.html";
            } catch (error) {
                showMessage(readableError(error));
            }
        }

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (busy) return;
            hideMessage();

            if (!authForm.reportValidity()) return;

            setLoading(true);

            try {
                if (currentMode === "register") {
                    await registerAccount();
                } else {
                    await loginAccount();
                }
            } catch (error) {
                showMessage(readableError(error));
            } finally {
                setLoading(false);
            }
        });

        forgotPasswordButton.addEventListener("click", async () => {
            hideMessage();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("請先輸入電子郵件，再申請重設密碼。");
                emailInput.focus();
                return;
            }

            forgotPasswordButton.disabled = true;

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage(
                    "如果這個電子郵件已註冊，系統會寄送密碼重設信。請檢查收件匣及垃圾郵件。",
                    "success"
                );
            } catch (error) {
                showMessage(readableError(error));
            } finally {
                forgotPasswordButton.disabled = false;
            }
        });

        resendVerificationButton.addEventListener("click", async () => {
            hideMessage();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("請輸入電子郵件和密碼，才能重新寄送驗證信。");
                return;
            }

            resendVerificationButton.disabled = true;

            try {
                const credential = await signInWithEmailAndPassword(
                    auth, email, password
                );

                if (credential.user.emailVerified) {
                    await signOut(auth);
                    showMessage("信箱已完成驗證，請重新登入。", "success");
                    resendVerificationButton.classList.add("hidden");
                    return;
                }

                await sendEmailVerification(credential.user);
                await signOut(auth);

                showMessage("驗證信已重新寄出，請到信箱查看。", "success");
            } catch (error) {
                showMessage(readableError(error));
            } finally {
                resendVerificationButton.disabled = false;
            }
        });

        [usernameInput, emailInput, passwordInput, confirmPasswordInput].forEach((input) => {
            input.addEventListener("input", hideMessage);
        });

        switchMode("login");
    </script>
</body>
</html>
